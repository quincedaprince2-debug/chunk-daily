<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Chunk Daily — 오늘의 영어 퍼즐</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F3F8FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chunk Daily">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ============ Chunk Daily — "sea chart" design system ============
     Ink  #14213D  text, structure        Foam  #F3F8FA  app background
     Lagoon #11A99B  go / correct          Buoy  #FF7A1A  rewards, streak, current spot
     Sand #F2DFB8  islands                 Reef  #E5484D  errors only                 */
  :root{
    --ink:#14213D; --ink2:#46536B; --muted:#7A8699; --line:#DCE5EA; --line2:#C9D5DC;
    --bg:#F3F8FA; --card:#FFFFFF;
    --lagoon:#11A99B; --lagoon-d:#0B8579; --lagoon-t:#DDF5F1;
    --buoy:#FF7A1A; --buoy-d:#D9600A; --buoy-t:#FFEBDC;
    --sand:#F2DFB8; --sand-d:#D9BE86;
    --reef:#E5484D; --reef-d:#B8333A; --reef-t:#FDE7E8;
    --sky:#2F80ED; --sky-d:#1F64C4;
    /* old names kept so nothing breaks */
    --coral:var(--lagoon); --coral-d:var(--lagoon-d); --mint:var(--lagoon); --mint-d:var(--lagoon-d);
    --sun:var(--buoy); --red:var(--reef); --sea:var(--sky); --sea-d:var(--sky-d);
    --display:'Do Hyeon','Noto Sans KR',sans-serif;
    --text:'Nunito','Noto Sans KR',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
  h2,.big,.hellotitle,.islandtitle,.fbtitle{text-wrap:balance}
  #daytag{display:none}
  .wordmark{white-space:nowrap}
  .brand{min-width:0}
  .say,.bigplay,.mic,.minimic{display:flex;align-items:center;justify-content:center;padding:0}
  .say svg{width:21px;height:21px} .say.sm svg{width:17px;height:17px}
  .bigplay svg{width:44%;height:44%}
  .mic svg{width:42px;height:42px} .minimic svg{width:22px;height:22px}
  .speed svg{width:15px;height:15px;vertical-align:-3px;margin-right:4px}
  .btn.ghost svg{width:22px;height:22px;display:block;margin:0 auto}
  .hearts{display:flex;gap:4px}
  .hrt{color:#D5DDE3;display:flex} .hrt.on{color:var(--reef)} .hrt svg{width:24px;height:24px}
  button{font-family:inherit}
  :focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:12px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .wrap{max-width:460px;margin:0 auto;padding:12px 18px 40px;min-height:100vh}

  /* ---------- app bar (home + results) ---------- */
  header.appbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 10px}
  .brand{display:flex;align-items:center;gap:8px}
  .brandmark{width:34px;height:28px;display:block}
  .wordmark{font-family:var(--display);font-size:23px;letter-spacing:-.3px;color:var(--ink)}
  .stats{display:flex;gap:4px;align-items:center;flex:0 0 auto}
  .stat{display:flex;align-items:center;gap:3px;font-weight:900;font-size:16px;padding:4px 4px;border-radius:10px;white-space:nowrap}
  .stat svg{width:22px;height:22px}
  .stat.streak{color:var(--buoy)}
  .stat.xp{color:var(--sky)}
  .stat.dim{color:#AAB5C3}
  .iconbtn{display:flex;align-items:center;justify-content:center;background:transparent;border:2px solid var(--line);border-radius:12px;min-width:36px;height:36px;padding:0 8px;font-weight:900;font-size:13px;cursor:pointer;color:var(--ink2)}
  .iconbtn svg{width:20px;height:20px}
  .pill.bump{animation:pillpop .7s ease-out}
  @keyframes pillpop{35%{transform:scale(1.5)}100%{transform:scale(1)}}

  /* ---------- lesson bar (focus mode) ---------- */
  .lessonbar{display:none;align-items:center;gap:10px;padding:2px 0 6px}
  .lessonbar.show{display:flex}
  .quit{background:none;border:none;cursor:pointer;color:#9AA6B6;padding:4px;display:flex}
  .quit svg{width:24px;height:24px}
  .track{position:relative;flex:1;height:44px;border-radius:14px;background:linear-gradient(#E3F4F8,#BFE6EF);overflow:hidden}
  .wave{position:absolute;left:-20px;right:-20px;bottom:0;height:10px;background:radial-gradient(circle at 8px -2px,transparent 8px,#8FD3E3 9px) 0 0/16px 10px;animation:drift 2.5s linear infinite}
  @keyframes drift{to{transform:translateX(16px)}}
  .isle{position:absolute;right:4px;bottom:2px;font-size:28px;line-height:1}
  .boat{position:absolute;bottom:4px;left:calc((100% - 78px) * var(--p,0) + 2px);width:42px;height:35px;transition:left .9s cubic-bezier(.3,1.35,.5,1);animation:bob 2.2s ease-in-out infinite;transform-origin:50% 80%}
  .boat svg{width:100%;height:100%;display:block}
  @keyframes bob{50%{transform:translateY(-2px) rotate(-2deg)}}
  .boat.dash{animation:dash .55s ease-out}
  @keyframes dash{35%{transform:translateY(-7px) rotate(7deg)}}
  .boat.rock{animation:rock .7s ease-in-out}
  @keyframes rock{20%{transform:rotate(-16deg)}50%{transform:rotate(13deg)}80%{transform:rotate(-6deg)}}
  .boat.cheer{animation:cheer .5s ease-in-out 4}
  @keyframes cheer{50%{transform:translateY(-10px)}}
  .splash{position:absolute;bottom:18px;font-size:16px;pointer-events:none;animation:splash .9s ease-out forwards}
  @keyframes splash{to{transform:translateY(-20px) scale(1.3);opacity:0}}
  .speed{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 9px;font-weight:800;font-size:12px;cursor:pointer;color:var(--ink2);white-space:nowrap}
  .toprow{display:none;margin:4px 0 0}
  .toprow.show{display:block}
  .topleft{display:flex;align-items:center}
  .daytag{font-weight:800;color:var(--muted);font-size:13px}
  .badge{display:none;background:var(--buoy-t);color:var(--buoy-d);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;margin-left:8px}
  .badge.show{display:inline-block}
  .badge.isl{background:#E2EEFF;color:var(--sky-d)}

  /* ---------- stages + surfaces ---------- */
  .stage{display:none}
  .stage.show{display:block;animation:enter .25s ease-out}
  @keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{background:transparent;padding:14px 0 0}
  .label{font-size:14px;color:var(--muted);font-weight:800}
  .smallnote{color:var(--muted);font-size:13px;font-weight:700;margin-top:8px;line-height:1.5}

  /* ---------- buttons: one primary color, one secondary style ---------- */
  .btn{flex:1;font-weight:900;font-size:17px;border:none;border-radius:16px;padding:15px;cursor:pointer;color:#fff;background:var(--lagoon);box-shadow:0 4px 0 var(--lagoon-d);transition:transform .06s,box-shadow .06s;letter-spacing:.2px}
  .btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--lagoon-d)}
  .btn:disabled{background:#E4EAEE;color:#A6B1BF;box-shadow:0 4px 0 #CDD6DD;cursor:default}
  .btn:disabled:active{transform:none}
  .btn.ghost,.btn.ink{background:var(--card);color:var(--ink2);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
  .btn.ghost{flex:0 0 auto;padding:13px 16px}
  .btn.mint{background:var(--lagoon);box-shadow:0 4px 0 var(--lagoon-d)}
  .btn.sea{background:var(--sky);box-shadow:0 4px 0 var(--sky-d)}
  .btn.gold{background:var(--buoy);box-shadow:0 4px 0 var(--buoy-d)}
  .hintbtn{font-size:19px;padding:13px 15px}
  .hintbtn.locked{opacity:.4}
  .actions{margin-top:18px;display:flex;gap:10px}
  #build .actions{position:sticky;bottom:12px;z-index:3;background:linear-gradient(transparent,var(--bg) 30%);padding-top:16px}
  .skip{display:block;margin:14px auto 0;background:none;border:none;color:var(--muted);font-weight:800;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .linkbtn{display:block;margin:12px auto 0;background:none;border:none;color:var(--ink2);font-weight:900;font-size:15px;cursor:pointer;padding:8px}

  .say{border:none;background:var(--sky);color:#fff;border-radius:50%;width:42px;height:42px;font-size:17px;cursor:pointer;box-shadow:0 3px 0 var(--sky-d);flex:0 0 auto}
  .say:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sky-d)}
  .say.sm{width:34px;height:34px;font-size:14px}

  /* ---------- learn ---------- */
  .topic{font-weight:800;font-size:14px;color:var(--lagoon-d);margin-top:2px}
  .chunkbig{font-family:var(--text);font-weight:900;font-size:32px;line-height:1.15;margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;letter-spacing:-.4px}
  .meaning{margin-top:10px;font-weight:800;font-size:21px;line-height:1.4}
  .use{margin-top:4px;color:var(--muted);font-weight:700;font-size:14px}
  .example{margin-top:18px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
  .example .exen{font-weight:900;font-size:18px;display:flex;align-items:center;gap:8px;justify-content:space-between}
  .example .exko{margin-top:4px;color:var(--muted);font-size:15px}
  .example mark{background:var(--buoy-t);color:var(--buoy-d);border-radius:6px;padding:0 4px}
  .repeat{margin-top:12px;display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px 14px;background:var(--lagoon-t)}
  .minimic{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:none;background:var(--lagoon);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 3px 0 var(--lagoon-d)}
  .minimic.live{background:var(--reef);box-shadow:0 3px 0 var(--reef-d);animation:pulse 1.2s infinite}
  .minimic.done{background:var(--lagoon-d)}
  .repeat .rtxt{flex:1;font-weight:800;font-size:15px;line-height:1.4}
  .repeat .rtxt small{display:block;color:var(--ink2);opacity:.75;font-weight:700;font-size:13px;margin-top:2px}

  /* ---------- island intro ---------- */
  .islandhero{text-align:center;font-size:44px;line-height:1;margin-top:6px}
  .islandtitle{font-family:var(--display);font-size:26px;text-align:center;margin-top:8px}
  .islanddesc{text-align:center;color:var(--muted);font-weight:700;font-size:15px;margin-top:6px;line-height:1.5}
  .dialog{margin-top:16px;display:flex;flex-direction:column;gap:8px}
  .bub{max-width:84%;padding:10px 14px;border-radius:18px;font-weight:800;font-size:15px;line-height:1.4;transition:transform .2s;cursor:pointer}
  .bub small{display:block;font-weight:600;color:var(--muted);font-size:12.5px;margin-top:2px}
  .bub .who{font-size:12px;font-weight:800;opacity:.6;display:block;margin-bottom:2px}
  .bub.you{align-self:flex-end;background:var(--lagoon-t);border-bottom-right-radius:6px}
  .bub.them{align-self:flex-start;background:var(--card);border:2px solid var(--line);border-bottom-left-radius:6px}
  .bub.on{transform:scale(1.03);box-shadow:0 0 0 3px var(--buoy)}
  .playall{display:block;margin:16px auto 0;border:none;background:var(--sky);color:#fff;font-weight:900;font-size:15px;border-radius:999px;padding:11px 20px;cursor:pointer;box-shadow:0 4px 0 var(--sky-d)}
  .recap{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
  .recap span{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:5px 10px;font-weight:800;font-size:13px}

  /* ---------- listen ---------- */
  .bigplay{display:block;margin:20px auto 6px;width:96px;height:96px;border-radius:28px;border:none;background:var(--sky);color:#fff;font-size:38px;cursor:pointer;box-shadow:0 6px 0 var(--sky-d)}
  .bigplay:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sky-d)}
  .bigplay.playing{animation:pulseb 1s infinite}
  @keyframes pulseb{0%{box-shadow:0 0 0 0 rgba(47,128,237,.45),0 6px 0 var(--sky-d)}70%{box-shadow:0 0 0 18px rgba(47,128,237,0),0 6px 0 var(--sky-d)}100%{box-shadow:0 0 0 0 rgba(47,128,237,0),0 6px 0 var(--sky-d)}}
  .qtext{text-align:center;font-weight:800;font-size:22px;margin:16px 0 4px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
  .opt{font-weight:800;font-size:16px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:16px 8px;cursor:pointer}
  .opt:active{transform:translateY(2px);border-bottom-width:2px}
  .opt.right{background:var(--lagoon-t);border-color:var(--lagoon);color:var(--lagoon-d)}
  .opt.wrong{background:var(--reef-t);border-color:var(--reef);color:var(--reef-d);animation:shake .4s}

  /* ---------- build: clean white tiles on ruled lines ---------- */
  .ko{font-weight:800;font-size:23px;line-height:1.4;margin-top:10px}
  .gloss{color:var(--muted);font-size:14px;font-weight:700;margin-top:2px}
  .audiobox{display:flex;align-items:center;gap:14px;margin-top:12px}
  .audiobox .bigplay{margin:0;width:76px;height:76px;font-size:30px;border-radius:24px}
  .audiobox .peek{background:none;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;cursor:pointer;color:var(--ink2)}
  .hearts{margin-top:10px;font-size:16px;letter-spacing:2px}
  .answer{min-height:118px;margin-top:16px;padding:3px 0 8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;
    background:repeating-linear-gradient(transparent 0 56px,var(--line2) 56px 58px);transition:background-color .2s;border-radius:6px}
  .answer .ph{color:#AEB9C6;font-size:14px;font-weight:700;padding:12px 2px}
  .answer.wrong{animation:shake .4s}
  .answer.right .chunk{border-color:var(--lagoon);color:var(--lagoon-d);background:var(--lagoon-t)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;justify-content:center}
  .chunk{font-weight:800;font-size:17px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px 14px;cursor:pointer;transition:transform .06s,opacity .15s}
  .chunk:active{transform:translateY(2px);border-bottom-width:2px}
  .chunk.used{background:#E8EEF2;color:transparent;border-color:#E8EEF2;pointer-events:none}
  .answer .chunk{animation:snap .2s ease-out}
  @keyframes snap{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
  .reveal .chunk{border-color:var(--lagoon)!important;color:var(--lagoon-d)!important;background:var(--lagoon-t)!important}
  .feedback{min-height:22px;text-align:center;font-weight:800;margin-top:12px;color:var(--reef)}
  .feedback.good{color:var(--lagoon-d)}

  /* ---------- speak + ask ---------- */
  .target{font-weight:900;font-size:22px;margin-top:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;line-height:1.35}
  .targetko{color:var(--muted);font-size:15px;margin-top:4px}
  .usechip{margin-top:12px;display:inline-block;background:var(--buoy-t);color:var(--buoy-d);border-radius:12px;padding:7px 11px;font-weight:800;font-size:14px}
  .micwrap{display:flex;flex-direction:column;align-items:center;margin-top:24px}
  .mic{width:96px;height:96px;border-radius:50%;border:none;background:var(--lagoon);color:#fff;font-size:38px;cursor:pointer;box-shadow:0 6px 0 var(--lagoon-d)}
  .mic:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lagoon-d)}
  .mic:disabled{background:#E4EAEE;box-shadow:0 6px 0 #CDD6DD}
  .mic.live{background:var(--reef);box-shadow:0 6px 0 var(--reef-d);animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.45)}70%{box-shadow:0 0 0 22px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
  .michint{margin-top:12px;font-weight:800;color:var(--muted);font-size:14px;text-align:center}
  .heard{margin-top:16px;min-height:48px;border-radius:16px;background:var(--card);border:2px solid var(--line);padding:12px;font-size:17px;font-weight:700;line-height:1.6}
  .heard:empty{display:none}
  .heard .w{display:inline-block;border-radius:6px;padding:0 5px;margin:2px}
  .heard .ok{background:var(--lagoon-t);color:var(--lagoon-d)}
  .heard .miss{background:var(--reef-t);color:var(--reef-d);text-decoration:line-through}
  .heard .hit{background:var(--buoy-t);color:var(--buoy-d);border-radius:6px;padding:0 4px}
  .exans{margin-top:12px;background:var(--lagoon-t);border-radius:16px;padding:12px 14px;display:none;align-items:center;gap:10px;justify-content:space-between;font-weight:800}
  .exans.show{display:flex}
  .exans small{display:block;color:var(--lagoon-d);font-weight:800;font-size:12px}

  /* ---------- results ---------- */
  #result .card{text-align:center}
  .resmascot{width:110px;height:88px;margin:4px auto 0}
  .big{font-family:var(--display);font-size:34px;text-align:center;margin-top:6px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
  .tile{border-radius:16px;border:2px solid;overflow:hidden;text-align:center;background:var(--card)}
  .tile small{display:block;color:#fff;font-weight:900;font-size:12px;padding:5px 0}
  .tile b{display:block;font-weight:900;font-size:22px;padding:10px 0 12px}
  .tile.t-xp{border-color:var(--buoy)} .tile.t-xp small{background:var(--buoy)} .tile.t-xp b{color:var(--buoy-d)}
  .tile.t-acc{border-color:var(--lagoon)} .tile.t-acc small{background:var(--lagoon)} .tile.t-acc b{color:var(--lagoon-d)}
  .tile.t-talk{border-color:var(--sky)} .tile.t-talk small{background:var(--sky)} .tile.t-talk b{color:var(--sky-d)}
  .xpgain,.statsrow{display:none}
  .review{margin-top:20px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:6px 16px}
  .review .label{padding-top:10px}
  .review .row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:2px solid #EEF3F6}
  .review .row:last-child{border-bottom:none}
  .review .row b{font-size:16px}
  .review .row span{color:var(--muted);font-size:13px;text-align:right}
  .tip{margin-top:12px;text-align:left;background:var(--buoy-t);border-radius:16px;padding:14px;font-size:15px;line-height:1.6}
  .sharebox{margin-top:16px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;text-align:center}
  #shareTitle{font-family:var(--display);font-size:19px}
  .sharebox .sq{font-size:22px;letter-spacing:3px;margin:6px 0}
  .sharebox small{color:var(--muted);font-weight:700}
  .sharebtns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .countdown{text-align:center;margin-top:14px;color:var(--muted);font-weight:800;font-size:14px}
  .countdown b{color:var(--ink);font-size:17px}

  /* ---------- home: greeting, review, sea chart ---------- */
  .hello{display:flex;align-items:center;gap:14px;padding:8px 0 4px}
  .heromascot{width:78px;height:64px;flex:0 0 auto}
  .hellotitle{font-family:var(--display);font-size:25px;line-height:1.2}
  .homestats{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-weight:800;font-size:13px}
  .reviewbar{display:flex;align-items:center;gap:12px;margin-top:14px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 12px 12px 14px}
  .reviewbar .rvicon{font-size:26px}
  .reviewbar .rvtext{flex:1;min-width:0}
  .reviewbar b{display:block;font-size:16px}
  .reviewbar small{display:block;color:var(--muted);font-weight:700;font-size:12.5px;margin-top:1px}
  .reviewbar .btn{flex:0 0 auto;padding:10px 14px;font-size:14px;border-radius:12px}
  .chart{margin:18px -18px 0;padding:6px 18px 150px;
    background:
      radial-gradient(circle at 20% 10%,rgba(255,255,255,.55) 0 2px,transparent 3px) 0 0/46px 46px,
      linear-gradient(#E6F4F8,#D5EDF4 40%,#CBE7F0);}
  .lvdivider{display:flex;align-items:center;gap:10px;margin:22px 0 4px;color:var(--ink2);font-weight:900;font-size:13px}
  .lvdivider::before,.lvdivider::after{content:"";flex:1;height:2px;background:rgba(20,33,61,.12);border-radius:2px}
  .lvdivider.soon{color:#97A5B5}

  .stops{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 4px}

  @keyframes ring{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.25);opacity:0}}
  .stop.isl .isle-btn{background:var(--sand);color:var(--ink);box-shadow:0 6px 0 var(--sand-d);font-size:30px;width:84px;height:74px;border-radius:44% 56% 50% 50%}

  .stop.isl.next .isle-btn{box-shadow:0 6px 0 var(--sand-d),0 0 0 5px var(--buoy)}
  .startbubble{position:absolute;top:-38px;background:var(--card);color:var(--buoy-d);font-weight:900;font-size:13px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);white-space:nowrap;animation:bob2 1.4s ease-in-out infinite;z-index:2}
  .startbubble::after{content:"";position:absolute;left:50%;margin-left:-6px;bottom:-7px;border:6px solid transparent;border-top-color:var(--card);border-bottom:0}
  @keyframes bob2{50%{transform:translateY(-4px)}}
  .stop.next{margin-top:30px}
  .hereboat{position:absolute;top:22px;width:54px;height:45px;animation:bob 2.2s ease-in-out infinite;pointer-events:none}
  .hereboat.r{left:96px} .hereboat.l{right:96px}
  .hereboat svg{width:100%;height:100%}
  .pop{display:none;width:min(300px,86vw);margin-top:12px;background:var(--card);border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(20,33,61,.18);text-align:left;position:relative;z-index:4;animation:enter .18s ease-out}

  .pop small{display:block;color:var(--muted);font-weight:800;font-size:12.5px}
  .pop b{display:block;font-size:18px;margin-top:2px}
  .pop .btn{width:100%;margin-top:14px}
  .finish{margin-top:26px;text-align:center;font-family:var(--display);font-size:19px;color:var(--ink2)}
  .homecta{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:460px;padding:12px 18px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(rgba(243,248,250,0),var(--bg) 26%);z-index:5;display:none}
  .homecta.show{display:block}
  .nextbox{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px 8px}
  .nextbox small{color:var(--muted);font-weight:800;font-size:12.5px}
  .nextbox b{font-weight:900;font-size:15px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nextbox span{display:none}

  /* ---------- settings ---------- */
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:2px solid #EEF3F6}
  .setrow:last-child{border-bottom:none}

  .remrow{display:flex;gap:10px;align-items:center;margin-top:8px}

  .sheet .remrow .btn{flex:0 0 auto;width:auto;margin-top:0;padding:12px 14px;font-size:14px}

  /* ---------- modals, sheets, toast ---------- */
  .modal{position:fixed;inset:0;background:rgba(20,33,61,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:9}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:8}

  /* feedback sheet */
  .fbsheet{position:fixed;left:50%;bottom:0;width:100%;max-width:460px;transform:translate(-50%,110%);transition:transform .28s cubic-bezier(.2,.9,.3,1.1);z-index:7;padding:16px 18px calc(18px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0}

  /* mascot */
  .mascot{display:block;width:100%;height:100%;overflow:visible}
  .mascot .eyes{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  .float{animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-5px)}}
  .jump{animation:jump .6s ease-in-out 3}
  @keyframes jump{30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}

  /* social pieces */
  .storywrap{position:relative;margin-top:6px;border-radius:16px;overflow:hidden;background:#EEF3F6;min-height:200px}
  .storywrap img{width:100%;display:block}
  .storywait{text-align:center;padding:80px 0;font-weight:800;color:var(--muted)}
  .nick{width:100%;font-size:18px;font-weight:800;padding:12px 14px;border:2px solid var(--line);border-radius:14px;margin-top:6px;outline:none;font-family:var(--text)}
  .nick:focus{border-color:var(--lagoon)}
  .chpreview{white-space:pre-wrap;background:#F3F8FA;border-radius:14px;padding:12px;margin-top:12px;font-size:14px;font-weight:700;line-height:1.5;word-break:break-all}
  .vsinfo{text-align:center;font-size:16px;line-height:1.7;margin-top:6px}
  .vsbox{margin-top:16px;background:var(--buoy-t);border-radius:18px;padding:14px}
  .vsrow{display:flex;align-items:center;justify-content:space-around;text-align:center}
  .vsrow small{display:block;font-weight:800;color:var(--muted);font-size:13px}
  .vsrow b{font-size:40px;font-family:var(--display);font-weight:400}
  .vsx{font-family:var(--display);font-size:22px;color:var(--buoy-d)}
  .vsverdict{text-align:center;font-weight:900;font-size:17px;margin-top:6px}
  .inapp{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:90;display:none;gap:10px;align-items:flex-start;background:#14213D;color:#fff;border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px;line-height:1.45;box-shadow:0 8px 24px rgba(20,33,61,.25)}
  .inapp.show{display:flex}
  /* ===== calm lesson layout: thin progress bar, one focus, one button pinned to the bottom ===== */
  .lessonbar{gap:14px;padding:6px 0 10px}
  .track{height:16px;border-radius:8px;background:#E1E9EF;overflow:hidden}
  .track::before{content:"";position:absolute;left:0;top:0;bottom:0;width:max(16px,calc(var(--p,0) * 100%));background:var(--lagoon);border-radius:8px;transition:width .5s cubic-bezier(.3,1.2,.5,1)}
  .track::after{content:"";position:absolute;left:8px;top:4px;height:4px;width:max(0px,calc(var(--p,0) * 100% - 16px));background:rgba(255,255,255,.35);border-radius:2px;transition:width .5s}
  .track .isle,.track .boat,.track .splash,.track .wave,.lessonbar .speed{display:none!important}
  .bubble mark{background:#CFF3EC;color:#0B7F75;border-radius:6px;padding:1px 4px}
  .lessonbar .hearts{margin:0;flex:0 0 auto}
  .stage .card{padding-bottom:120px}
  #learn .actions,#build .actions,#intro .actions,#speak .actions{position:fixed;left:max(0px,calc(50% - 230px));right:max(0px,calc(50% - 230px));bottom:0;margin:0;padding:14px 18px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(rgba(243,248,250,0),var(--bg) 30%);z-index:5}
  #learnBack,#resetBtn,#learn .topic{display:none!important}
  #build .hintbtn{flex:0 0 58px}
  #result{padding-bottom:110px}
  #result #nextLessonBtn{position:fixed;left:max(18px,calc(50% - 212px));right:max(18px,calc(50% - 212px));bottom:calc(18px + env(safe-area-inset-bottom));width:auto!important;margin:0!important;z-index:5}
  #resStats,#review,.sharebox .sq{display:none!important}
  .sharebox{display:none}
  .sharebox.open{display:block}
  /* scenes */
  .scene .char{flex:0 0 104px;height:114px}
  .scene.center{flex-direction:column;align-items:center;gap:14px;margin-top:18px}
  .scene.center .char{flex:0 0 auto;width:148px;height:162px;margin:0}
  .scene.center .bubble{flex:0 0 auto;align-self:stretch;margin:0;padding:16px 18px}
  .scene.center .bubble.fit{align-self:center}
  .scene.center .bubble::before{left:50%;top:-9px;bottom:auto;margin-left:-7px;transform:rotate(135deg)}
  .scene.center .exen{font-size:22px;font-weight:900}
  .scene.center .exko{font-size:15px;margin-top:6px}
  .scene.center .bubplay{width:76px;height:76px}
  .scene.center .bubplay svg{width:36px;height:36px}
  .chunkcard{margin-top:22px;text-align:center}
  .chunkcard .chunkbig{justify-content:center;font-size:26px}
  .chunkcard .meaning{font-size:18px;margin-top:4px}
  .chunkcard .use{margin-top:6px}
  #learn.p0 #repeatBox,#learn.p0 #repHeard{display:none!important}
  #learn.p1 #chunkCard{display:none}
  #learn .repeat{flex-direction:column;background:none;text-align:center;margin-top:26px;gap:14px;padding:0}
  #learn .minimic{width:96px;height:96px;box-shadow:0 6px 0 var(--lagoon-d)}
  #learn .minimic svg{width:42px;height:42px}
  #learn .repeat .rtxt>span{display:none}
  #learn .repeat .rtxt small{font-size:15px;opacity:1}
  #learn .heard{text-align:center}
  /* ---- character scenes: a character "says" the line in a speech bubble ---- */
  .scene{display:flex;align-items:flex-end;gap:8px;margin:14px 0 10px;text-align:left}
  .scene .char{flex:0 0 88px;height:96px;margin-bottom:-4px}
  .scene.sm .char{flex-basis:62px;height:68px}
  .char svg{width:100%;height:100%;overflow:visible;transform-origin:50% 100%}
  .bubble{position:relative;flex:1;min-width:0;background:#fff;border:2px solid #D8E3EA;border-radius:18px;padding:12px 14px;margin-bottom:22px;box-shadow:0 3px 0 #D8E3EA}
  .bubble::before{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:#fff;border-left:2px solid #D8E3EA;border-bottom:2px solid #D8E3EA;transform:rotate(45deg)}
  .scene.sm .bubble{margin-bottom:12px;padding:10px 12px}
  .bubble .target{justify-content:flex-start;font-size:22px;margin:0}
  .bubble .targetko{text-align:left;margin:6px 0 0}
  .bubble .ko{text-align:left;margin:0;font-size:20px}
  .bubaudio + .ko{margin-top:14px}
  .bubble .gloss{text-align:left}
  .bubble .exen{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap}
  .bubble.fit{flex:0 1 auto}
  .bubble .say{flex:0 0 auto;width:28px;height:28px;background:none;box-shadow:none;color:var(--sky);padding:0;pointer-events:none}
  .bubble .say svg{width:20px;height:20px}
  .bubble.tap,.scene .char{cursor:pointer}
  .bubble.tap:active{transform:translateY(2px);box-shadow:0 1px 0 #D8E3EA}
  #sayChunk{display:none}
  #chunkEn{cursor:pointer}
  .scene{margin:10px 0 6px}
  #build .hearts{justify-content:flex-end;margin:-6px 0 4px}
  .bubble .exko{text-align:left}
  .bubaudio{display:flex;align-items:center;gap:10px}
  .bubplay{width:58px;height:58px;border-radius:50%;border:none;background:var(--sky);color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--sky-d);display:flex;align-items:center;justify-content:center;transition:transform .06s,box-shadow .06s}
  .bubplay svg{width:28px;height:28px}
  .bubplay:active{transform:translateY(4px);box-shadow:0 0 0 var(--sky-d)}
  .bubplay.playing{animation:pulse 1s ease-in-out infinite}
  .peekrow{text-align:center;margin:-4px 0 6px}
  .char .m-open{opacity:0}
  .char.talking .m-open{animation:mouthO .3s steps(1) infinite}
  .char.talking .m-closed{animation:mouthC .3s steps(1) infinite}
  .char.talking svg{animation:talkBob .6s ease-in-out infinite}
  .char .lids{opacity:0;animation:lidBlink 4.2s infinite}
  @keyframes mouthO{0%{opacity:1}50%{opacity:0}}
  @keyframes mouthC{0%{opacity:0}50%{opacity:1}}
  @keyframes talkBob{50%{transform:translateY(-2px) rotate(-1.5deg)}}
  @keyframes lidBlink{0%,95%,100%{opacity:0}97%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.char.talking svg,.char .lids{animation:none}}
  /* island conversation as a chat */
  .dialog .line{display:flex;align-items:flex-end;gap:6px;margin:8px 0}
  .dialog .line.you{flex-direction:row-reverse}
  .dialog .line .char{flex:0 0 48px;height:52px}
  .dialog .line .bub{margin:0 0 6px;max-width:78%}
  /* mistakes review on the results screen */
  .mistakes{display:none;margin-top:14px;text-align:left;background:#FFF4EC;border:2px solid #FFD9BF;border-radius:18px;padding:14px 16px}
  .mistakes.show{display:block}
  .mistakes .label{color:#C2560E}
  .mistakes .mrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #FFE3CF}
  .mistakes .mrow:first-of-type{border-top:none}
  .mistakes .mrow div{flex:1;min-width:0}
  .mistakes .mrow b{display:block;color:#14213D;font-size:16px}
  .mistakes .mrow span{color:#6B7A90;font-weight:700;font-size:13px}
  .mistakes .btn{margin-top:10px;width:100%;background:#FF7A1A;box-shadow:0 4px 0 #C2560E}
  .mistakes .btn:active{box-shadow:0 0 0 #C2560E}
  .welcome{text-align:center;padding-top:28px}
  .welcome .wart{height:118px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
  .welcome .wart svg{width:104px;height:84px}
  .welcome #wSlide{min-height:250px;display:flex;flex-direction:column;justify-content:center}
  .welcome h2{padding:0;margin:4px 0 8px;font-size:24px;line-height:1.3}
  .welcome p{margin:0 auto;max-width:320px;font-weight:700;font-size:15px;line-height:1.6;color:#3C4A66}
  .welcome p b{color:#0E8A7F}
  .wlevels{display:flex;flex-direction:column;gap:8px;margin:4px auto 12px;max-width:300px;text-align:left}
  .wlevels div{display:flex;gap:12px;align-items:center;font-weight:800;font-size:15px;color:#14213D}
  .wlevels span{flex:0 0 46px;text-align:center;border-radius:10px;padding:5px 0;font-size:13px;color:#fff}
  .wsteps{display:flex;flex-direction:column;gap:10px;margin:6px auto 12px;max-width:300px;text-align:left}
  .wsteps div{display:flex;gap:12px;align-items:center;font-weight:700;font-size:15px;color:#3C4A66}
  .wsteps i{flex:0 0 30px;height:30px;border-radius:50%;background:#11A99B;color:#fff;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center}
  .wsteps b{color:#14213D;margin-right:4px}
  .wdots{display:flex;gap:6px;justify-content:center;margin:16px 0 4px}
  .wdots i{width:8px;height:8px;border-radius:4px;background:#D8E3EA;transition:width .2s,background .2s}
  .wdots i.on{width:22px;background:#11A99B}
  .quickrow{display:none;gap:8px;margin-top:14px}
  .quickrow.show{display:flex}
  .qbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;border:2px solid #D8E3EA;border-radius:14px;padding:10px 8px;font:800 14px inherit;color:#14213D;cursor:pointer}
  .qbtn svg{width:18px;height:18px;color:#11A99B}
  .qbtn:active{transform:scale(.97)}
  .nudge{display:none;margin-top:16px;text-align:left;background:#E3F6F3;border:2px solid #BFE9E2;border-radius:18px;padding:14px 16px}
  .nudge.show{display:block;animation:nudgeIn .35s ease-out}
  .nudge b{display:block;font-size:16px;color:#14213D;margin-bottom:4px}
  .nudge p{margin:0 0 10px;font-weight:700;font-size:14px;line-height:1.5;color:#3C4A66}
  .nudge .nbtns{display:flex;gap:8px;align-items:center}
  .nudge .nbtns .btn{flex:1;margin:0}
  .nudge .later{flex:0 0 auto;background:none;border:0;font:800 14px inherit;color:#6B7A90;padding:10px 8px;cursor:pointer}
  @keyframes nudgeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.nudge.show{animation:none}}
  .bkcode{width:100%;box-sizing:border-box;border:2px solid #D8E3EA;border-radius:12px;padding:10px;font:600 12px/1.4 ui-monospace,monospace;color:#14213D;resize:none;word-break:break-all}
  .sheet .remrow .btn + .btn{margin-left:8px}
  .inapp b{color:#FFB37A}
  .inapp button{flex:0 0 auto;background:none;border:0;color:#fff;font-size:18px;line-height:1;padding:2px 4px;cursor:pointer}
</style>

<body>
<canvas id="confetti"></canvas>
<div class="homecta" id="homeCta"><div class="nextbox" id="nextBox"><small id="nextLbl"></small><b id="nextName"></b><span id="nextUnit"></span></div><button class="btn" id="homeStart"></button></div>
<div class="wrap">
  <header class="appbar" id="appbar">
    <div class="brand"><span class="brandmark" id="brandMark"></span><span class="wordmark">Chunk Daily</span></div>
    <div class="stats">
      <div class="stat streak pill" id="streak"></div>
      <div class="stat xp" id="xp"></div>
      <button class="iconbtn" id="mapBtn" aria-label="home"></button>
      <button class="iconbtn" id="langBtn">EN</button>
      <button class="iconbtn" id="helpBtn" aria-label="settings"></button>
    </div>
  </header>
  <div class="lessonbar" id="lessonBar">
    <button class="quit" id="quitBtn" aria-label="quit lesson"></button>
    <div class="track" id="track">
      <div class="isle">🏝️</div>
      <div class="boat" id="boat" aria-hidden="true">

function confetti(){
  const cv=$("confetti"), cx=cv.getContext("2d"); cv.width=innerWidth; cv.height=innerHeight;
  const cols=["#11A99B","#FF7A1A","#2F80ED","#F2DFB8","#FFC93C"];
  const ps=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;
  (function loop(){ cx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.04; p.r+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore(); });
    if(++f<200) requestAnimationFrame(loop); else cx.clearRect(0,0,cv.width,cv.height); })();
}

  heardCount++;

let autoT=null;
function showHeard(){

  clearTimeout(autoT); if(!txt || !micLive) return;
  const v = micCtx.judge ? micCtx.judge(txt) : 0;   // 2 = all correct, 1 = good enough, 0 = not yet
  if(v===2) return finishNow();

  const said=wordsRaw(txt).length, need=micCtx.targetLen||0, final=!heardP;

/* 2 = every word said (finish now), 1 = close enough (finish after a short pause), 0 = keep listening */
function judgeSentence(target, txt){ const p=scoreAgainst(target,txt).pct; const full=wordsRaw(txt).length>=wordsRaw(target).length; return p>=100 ? (full?2:1) : p>=70 ? 1 : 0; }

/* speech scoring */
const CONTR={"i'm":"i am","it's":"it is","there's":"there is","what's":"what is","let's":"let us","don't":"do not","can't":"can not","cannot":"can not","you're":"you are","gonna":"going to","wanna":"want to","where's":"where is","that's":"that is","i'll":"i will","we'll":"we will","you'll":"you will","how's":"how is","i'd":"i would","isn't":"is not","didn't":"did not","doesn't":"does not","won't":"will not","i've":"i have"};
/* sound-alikes and number words the recognizer mixes up, compared on both sides */
const HOMO={too:"to",two:"to","2":"to",four:"for","4":"for",their:"there",write:"right",sea:"see",high:"hi",bye:"by",buy:"by",know:"no",hour:"our",weak:"week",meat:"meet",hear:"here",won:"1",one:"1",ate:"8",eight:"8",okay:"ok",zero:"0",three:"3",five:"5",six:"6",seven:"7",nine:"9",ten:"10",eleven:"11",twelve:"12",alright:"all right"};
/* names the recognizer often misspells: never mark them wrong */
const NAMES=new Set(["alex","minji","junho","busan","gangnam","hongdae"]);
function wordsRaw(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[’‘]/g,"'").replace(/\bk[\s-]+(pop|dramas?)\b/g,"k$1").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean).flatMap(w=>(CONTR[w]||w).split(" ")); }
function canon(w){ return HOMO[w]||w; }
function words(s){ return wordsRaw(s).flatMap(w=>canon(w).split(" ")); }
function scoreAgainst(targetText, said){
  const bag={};
  words(said+" "+heardAlts).forEach(w=>bag[w]=(bag[w]||0)+1);
  const marks=wordsRaw(targetText).map(w=>{ const c=canon(w); if(NAMES.has(w)) return [w,true]; if(bag[c]){ bag[c]--; return [w,true]; } return [w,false]; });
  return {marks, pct:marks.length?Math.round(100*marks.filter(m=>m[1]).length/marks.length):0};
}
function markHTML(marks){ return marks.map(([w,ok])=>`<span class="w ${ok?'ok':'miss'}">${esc(w)}</span>`).join(" "); }

function renderHearts(){ $("hearts").innerHTML = revealed ? "" : Array.from({length:MAX_TRIES},(_,k)=>`<span class="hrt ${k<MAX_TRIES-tries?"on":""}">${ICON.heart}</span>`).join(""); }
function pick(btn){ if(revealPending) return; const sh=$("fbSheet"); if(sh.classList.contains("bad") && sh.classList.contains("show")){ retryTok++; hideSheet(); clearPicks(); } sfx.pop(); picked.push(btn); btn.classList.add("used"); $("feedback").textContent=""; $("answer").classList.remove("wrong"); renderAnswer(); }
function unpick(idx){ sfx.unpop(); const b=picked.splice(idx,1)[0]; b.classList.remove("used"); renderAnswer(); }
function renderAnswer(){
  const a=$("answer"); a.innerHTML=""; a.classList.remove("reveal");
  if(!picked.length) a.innerHTML=`<span class="ph">${t().tapHint}</span>`;
  picked.forEach((btn,idx)=>{ const c=document.createElement("button"); c.className="chunk"; c.textContent=btn.textContent; c.onclick=()=>unpick(idx); a.appendChild(c); });
  $("checkBtn").disabled=!picked.length;
}
function clearPicks(){ picked.forEach(b=>b.classList.remove("used")); picked=[]; $("answer").classList.remove("wrong"); }
function queueRetry(item){
  if(BS.retry || queued.has(item)) return;
  queued.add(item); steps.push({type:"build", item, retry:true, audio:BS.audio});
}
function check(){
  const guess=picked.map(b=>b.textContent);
  const ok=guess.length===B.answer.length && guess.every((g,i)=>g===B.answer[i]);
  if(ok){
    const clean1 = tries===0 && !revealed;
    allMarks.push(clean1?"🟩":"🟨");
    if(!clean1){ firstTryAll=false; queueRetry(B); }
    if(L.review && BS.src!==undefined && !clean1) LESSONS[BS.src].chunks.forEach(c=>srsGrade(c.en,false));
    $("answer").classList.add("right"); $("feedback").textContent="";
    $("ko").style.display="block"; $("peekBtn").style.display="none";
    if(S.lang==="en") $("gloss").textContent="= "+B.en;
    sfx.right(); setTimeout(()=>speak(B.answer.join(" ")),250);
    $("checkBtn").disabled=true;
    const praise=t().praise[Math.floor(Math.random()*t().praise.length)];
    const mine=BS;
    showSheet("good", praise, B.answer.join(" "), t().cont, ()=>{ if(mine===steps[step]) nextStep(); }, B.answer.join(" "));
    return;
  }
  tries++; mistakes++; noteMiss(B.answer.join(" "), B.ko, B); sfx.wrong(); boatFx("rock"); updateHintLock(); try{navigator.vibrate&&navigator.vibrate(80);}catch(_){}
  const a=$("answer"); a.classList.remove("wrong"); void a.offsetWidth; a.classList.add("wrong");
  if(!revealed && tries>=MAX_TRIES){ doReveal(); return; }
  renderHearts();
  const right=guess.filter((g,i)=>g===B.answer[i]).length;
  $("feedback").textContent="";
  const mine=BS, tok=++retryTok;
  const restart=()=>{ if(mine!==steps[step] || tok!==retryTok) return; retryTok++; hideSheet(); clearPicks(); renderAnswer(); if(BS.audio && tries===2) $("buildPlay").onclick(); };
  showSheet("bad", t().notQuite, right>0 ? t().close(right) : t().retry, t().tryAgain, restart, null);
  // clear the wrong answer right after the shake, then get out of the way on its own
  setTimeout(()=>{ if(mine===steps[step] && tok===retryTok){ clearPicks(); renderAnswer(); } },450);
  setTimeout(restart,1700);
}
let retryTok=0;
function doReveal(){
  revealed=true; revealPending=true; renderHearts();
  clearPicks();
  const a=$("answer"); a.innerHTML=""; a.className="answer reveal";
  B.answer.forEach(x=>{ const c=document.createElement("span"); c.className="chunk"; c.textContent=x; a.appendChild(c); });
  $("ko").style.display="block";
  $("feedback").textContent="";
  $("checkBtn").disabled=true; speak(B.answer.join(" "));
  const mine=BS;
  showSheet("bad", t().answerIs, B.answer.join(" "), t().buildIt, ()=>{ revealPending=false; if(mine!==steps[step]) return; renderAnswer(); $("feedback").className="feedback good"; $("feedback").textContent=t().revealNow; }, B.answer.join(" "));
}

  if(revealPending) return;

  toast(t().hintCost);

    curScore=Math.max(10, 30-3*mistakes-5*hints);
    const gained=Math.round(curScore/2)+5; S.xp+=gained;
    if(S.lastDay!==TODAY){ S.streak=(S.lastDay===TODAY-1)?S.streak+1:1; S.lastDay=TODAY; }
    save(); track("review_finish",{chunks:L.chunks.length, mistakes, score:curScore});
    renderStats(); showResult(firstTryAll && mistakes===0, allMarks, gained, heardCount);
    sfx.win(); confetti(); setTimeout(()=>boatFx("cheer"),900); streakPop(streakBefore); return;
  }
  let gained=0;
  const perfect = firstTryAll && hints===0 && mistakes===0;
  curScore = Math.max(10, 30-3*mistakes-5*hints)+spoken*3;
  if(!practice){
    gained=curScore; S.xp+=gained;
    const idx=LESSONS.indexOf(L);
    S.done[idx]={ perfect, marks:allMarks.slice(), spoken, heard:heardCount, score:curScore };
    if(idx===S.next) S.next++;
    S.lastLesson=idx;
    if(!L.island) L.chunks.forEach(c=>{ if(!S.srs[c.en]) srsSet(c.en, perfect?2:1); });
    if(S.lastDay!==TODAY){ S.streak=(S.lastDay===TODAY-1)?S.streak+1:1; S.lastDay=TODAY; }
    save();
  } else { gained=5; S.xp+=5; save(); }
  track("lesson_finish",{lesson:L.id, unit:L.unit, practice, score:curScore, mistakes, hints, spoken, heard:heardCount, perfect});
  renderStats(); showResult(perfect, allMarks, gained, heardCount);
  sfx.win(); confetti(); setTimeout(()=>boatFx("cheer"),900); streakPop(streakBefore);
}

  if(S.streak<=before) return;

  $("homeStats").innerHTML = `<span>${t().day} ${myDay()}</span><span>${t().lessonsDone(Object.keys(S.done).length, LESSONS.length)}</span>`;
  if(S.next < LESSONS.length){
    const l=LESSONS[S.next];
    $("nextLbl").textContent=`${t().upNext}: ${lessonLabel(S.next)}`; $("nextName").textContent=l.topic[S.lang];
    $("nextUnit").textContent=`Unit ${l.unit} · ${UNITS[l.unit][S.lang]}`;
    $("homeStart").style.display=""; $("homeStart").textContent=t().startLesson;
  } else {
    $("nextLbl").textContent=""; $("nextName").textContent=t().allDone; $("nextUnit").textContent="";
    $("homeStart").style.display="none";
  }
  $("homeMapLbl").textContent=t().mapTitle;
  renderMap();
}
function goHome(){
  hideSheet(); stopAudio(); micAbort(); challengeMode=null; steps=[]; step=0;
  $("daytag").textContent=`${t().day} ${myDay()}`; $("pbadge").className="badge";
  renderHome(); show("home");
}
function askQuit(){
  $("quitTitle").textContent=t().quitTitle; $("quitText").textContent=t().quitText;
  $("quitStay").textContent=t().quitStay; $("quitLeave").textContent=t().quitLeave; $("quitMascot").innerHTML=mascotSVG("sad");
  openModal("quitModal");
}
/* Some previews stretch the page into one very tall frame; there, a centered popup can open out of view.
   In that case, open popups next to whatever was tapped. */
let lastTapY=0;
document.addEventListener("pointerdown",e=>{ lastTapY=e.pageY; },true);
function openModal(id){
  const m=$(id), sheet=m.querySelector(".sheet");
  const stretched = window.innerHeight > Math.max(screen.height||0, 900)*1.3;
  if(stretched){ m.style.position="absolute"; m.style.height=document.documentElement.scrollHeight+"px"; m.style.alignItems="flex-start";
    sheet.style.marginTop=Math.max(20, lastTapY-260)+"px"; sheet.style.maxHeight="none"; }
  else { m.style.position=""; m.style.height=""; m.style.alignItems=""; sheet.style.marginTop=""; sheet.style.maxHeight=""; }
  m.classList.add("show");
}


/* ----- help, language, speed ----- */
function renderHelp(){
  $("helpTitle").textContent=t().helpTitle;
  $("helpList").innerHTML=t().helpList.map(x=>`<li>${x}</li>`).join("");
  $("helpNote").innerHTML=t().helpNote+(POSTHOG_KEY?`<br><br><small>${t().privacy}</small>`:""); $("helpClose").textContent=t().go;
}
function toggleLang(){
  S.lang = S.lang==="ko"?"en":"ko"; save(); renderStats(); renderHelp(); socialTexts();
  if($("home").classList.contains("show")){ goHome(); return; }
  if(L) header();
  if($("result").classList.contains("show")){ showResult(lastRes.perfect, shownMarks, 0, lastRes.heard); return; }
  const s=steps[step]; if(!s) return;
  if(s.type==="build"){ // keep the learner's picks
    $("buildLabel").textContent = s.retry ? t().retryLbl : s.review ? t().review : s.audio ? t().buildAudio : `${t().build} (${s.i+1}/${s.n})`;
    if(!s.audio && S.lang==="en") $("gloss").textContent="= "+B.en; else if(!s.audio) $("gloss").textContent="";
    $("peekBtn").textContent=t().peek; $("checkBtn").textContent=t().check; $("feedback").textContent=""; renderAnswer();
  } else if(s.type==="listen"){ $("listenLabel").textContent=`${ttsOK?t().listen:t().listenNoAudio} (${lsIdx+1}/${lsRounds.length})`; }
  else runStep();
}

$("checkBtn").onclick=check;
$("resetBtn").onclick=()=>{ clearPicks(); $("feedback").textContent=""; renderAnswer(); };
$("hintBtn").onclick=openHint;
$("hintClose").onclick=()=>$("hintModal").classList.remove("show");
$("copyBtn").onclick=copyShare;
$("resMapBtn").onclick=goHome;
$("mapBtn").onclick=()=>{ if(inLesson()) askQuit(); else goHome(); };
$("quitBtn").onclick=askQuit;
$("quitStay").onclick=()=>$("quitModal").classList.remove("show");
$("quitLeave").onclick=()=>{ $("quitModal").classList.remove("show"); if(L) track("lesson_quit",{lesson:L.id, step, of:steps.length}); goHome(); };
$("reviewBtn").onclick=startReview;
$("quitBtn").innerHTML=ICON.x; $("mapBtn").innerHTML=ICON.home; $("helpBtn").innerHTML=ICON.tune;
document.querySelectorAll(".say,.bigplay").forEach(b=>b.innerHTML=ICON.speaker);
$("micBtn").innerHTML=ICON.mic; $("repMic").innerHTML=ICON.mic;
$("hintBtn").innerHTML=ICON.bulb; $("resetBtn").innerHTML=ICON.reset;
function renderSettings(){
  $("setTitle").textContent=t().setTitle; $("setSpeedLbl").textContent=t().setSpeed; $("setSpeedSub").textContent=t().setSpeedSub;
  $("setSpeed").textContent = S.speed==="slow"?t().slow:t().normal;
  $("setHelpLbl").textContent=t().helpTitle; $("setHelp").textContent=t().openHelp; $("setClose").textContent=t().close2;
  $("remLbl").textContent=t().remLbl; $("remBtn").textContent=t().remBtn; $("remTime").value=S.remindAt||"20:00";
  $("remNote").textContent = IN_CLAUDE ? t().remNo : t().remNote; renderInstall();
  $("bkLbl").textContent=t().bkLbl; $("bkNote").textContent=t().bkNote; $("bkSave").textContent=t().bkSave; $("bkLoad").textContent=t().bkLoad; $("bkApply").textContent=t().bkApply; $("bkCode").placeholder=t().bkPaste;
}
$("setSpeed").onclick=()=>{ S.speed = S.speed==="slow"?"normal":"slow"; save(); renderStats(); renderSettings(); };
$("setHelp").onclick=()=>{ $("settings").classList.remove("show"); openModal("help"); };
$("setClose").onclick=()=>$("settings").classList.remove("show");
$("remBtn").onclick=addReminder;
async function sendSaveLink(){
  const link=SITE_URL.replace(/#.*$/,"")+"#restore="+bkEncode();
  $("bkCode").value=link;
  try{ if(navigator.share && !IN_CLAUDE){ await navigator.share({title:"Chunk Daily", text:t().bkLbl, url:link}); return; } }catch(e){ if(e && e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(link); toast(t().bkCopied); }catch(e){ const ta=document.createElement("textarea"); ta.value=link; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(_){} ta.remove(); toast(t().bkCopied); }
  track("save_link");
}
$("bkSave").onclick=()=>{ $("bkBox").style.display="block"; $("bkApply").style.display="none"; sendSaveLink(); };
$("bkLoad").onclick=()=>{ $("bkBox").style.display="block"; $("bkCode").value=""; $("bkApply").style.display=""; $("bkCode").focus(); };
$("bkApply").onclick=()=>{ const r=bkApply(bkDecode($("bkCode").value)); toast(r==="ok"?t().bkDone:r==="older"?t().bkOlder:t().bkBad); if(r==="ok"){ $("settings").classList.remove("show"); renderStats(); try{ goHome(); }catch(e){} } };
$("remTime").onchange=()=>{ S.remindAt=$("remTime").value; save(); };
$("homeStart").onclick=()=>{ challengeMode=null; startLesson(S.next,false); };
$("langBtn").onclick=toggleLang;
$("speedBtn").onclick=()=>{ S.speed = S.speed==="slow"?"normal":"slow"; save(); renderStats(); toast(t().speedSet(S.speed==="slow"?t().slow:t().normal)); };
$("helpBtn").onclick=()=>{ $("bkBox").style.display="none"; renderSettings(); openModal("settings"); };
if(bkResult) setTimeout(()=>toast(bkResult==="ok"?t().bkDone:bkResult==="older"?t().bkOlder:t().bkBad),700);
$("helpClose").onclick=()=>{ ac(); $("help").classList.remove("show"); S.seenHelp=true; save(); };
/* first visit: what the app teaches, in 3 short screens */
let wIdx=0;
function renderWelcome(){
  const T0=t(), s=T0.w[wIdx], last=wIdx===T0.w.length-1;
  let mid="";
  if(wIdx===1) mid=`<div class="wlevels">${T0.wLevels.map(([lv,d],i)=>`<div><span style="background:${["#11A99B","#2F80ED","#FF7A1A"][i]}">${lv}</span>${d}</div>`).join("")}</div>`;
  if(wIdx===2) mid=`<div class="wsteps">${T0.wSteps.map(([a,b],i)=>`<div><i>${i+1}</i><span><b>${a}</b>${b}</span></div>`).join("")}</div>`;
  $("wSlide").innerHTML = (wIdx===0?`<div class="wart">${mascotSVG("happy")}</div>`:"") + `<h2>${s.t}</h2>` + mid + `<p>${s.p}</p>`;
  $("wDots").innerHTML=T0.w.map((_,i)=>`<i class="${i===wIdx?"on":""}"></i>`).join("");
  $("wNext").textContent = last ? T0.wGo : T0.wNext;
  $("wSkip").textContent = T0.wSkip; $("wSkip").style.visibility = last ? "hidden" : "visible";
}
function openWelcome(){ wIdx=0; renderWelcome(); $("welcome").classList.add("show"); }
function closeWelcome(){ ac(); $("welcome").classList.remove("show"); S.seenHelp=true; save(); track("welcome_done",{at:wIdx}); }
$("wNext").onclick=()=>{ ac(); if(wIdx < t().w.length-1){ wIdx++; renderWelcome(); } else closeWelcome(); };
$("wSkip").onclick=closeWelcome;

/* Teacher view: learners always get Korean menus. Add #teacher to the link to show the EN/한 switch. */
const TEACHER = location.hash==="#teacher";
if(!TEACHER){ $("langBtn").style.display="none"; S.lang="ko"; }
window.addEventListener("hashchange",()=>{ if(location.hash==="#teacher") $("langBtn").style.display=""; });

$("storyBtn").onclick=openStory;
$("storyShare").onclick=shareStory;
$("storyClose").onclick=()=>$("storyModal").classList.remove("show");
$("challengeBtn").onclick=openChallenge;
$("nickInput").oninput=updateChPreview;
$("chCopy").onclick=copyChallenge;
$("chClose").onclick=()=>$("challengeModal").classList.remove("show");
function socialTexts(){
  $("storyTitle").textContent=t().storyTitle; $("storyNote").textContent=t().storyNote; $("storyShare").textContent=t().storyShare; $("storyClose").textContent=t().close2;
  $("chTitle").textContent=t().chTitle; $("chNickLbl").textContent=t().chNick; $("chCopy").textContent=t().chCopy; $("chClose").textContent=t().close2;
}
socialTexts();

/* every popup: ✕ in the corner, tap outside, or Escape closes it (same as its own close button) */
const MODAL_CLOSE={welcome:"wSkip", help:"helpClose", settings:"setClose", quitModal:"quitStay", hintModal:"hintClose", storyModal:"storyClose", challengeModal:"chClose", vsModal:"vsLater"};
Object.entries(MODAL_CLOSE).forEach(([id,btn])=>{
  const m=$(id), x=document.createElement("button");
  x.className="xclose"; x.setAttribute("aria-label","close"); x.textContent="✕";
  x.onclick=()=>$(btn).click();
  m.querySelector(".sheet").prepend(x);
  m.addEventListener("click",e=>{ if(e.target===m) $(btn).click(); });
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  const open=Object.keys(MODAL_CLOSE).filter(id=>$(id).classList.contains("show")).pop();
  if(open) $(MODAL_CLOSE[open]).click();
});
$("nextLessonBtn").onclick=()=>{ challengeMode=null; startLesson(S.next,false); };

renderStats(); renderHelp();
track("app_open");
if(!S.sent["d"+TODAY]){ S.sent={["d"+TODAY]:1}; save(); track("active_day",{day_number:myDay()}); }
goHome();
challenge=readChallenge();
if(challenge){ S.seenHelp=true; save(); showIncoming(challenge); }
else if(!S.seenHelp) openWelcome();
</script>
</body>
