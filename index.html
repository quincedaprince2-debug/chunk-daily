  { id:"u33-kid", unit:33, topic:{"ko": "어렸을 때 꿈", "en": "Childhood dreams"}, chunks:[{"en": "When I was a kid, I wanted to be ___.", "ko": "어렸을 때 ~가 되고 싶었어요.", "use": {"ko": "어릴 적 꿈", "en": "A childhood dream"}, "ex": "When I was a kid, I wanted to be a pilot.", "hl": "When I was a kid", "exko": "어렸을 때 조종사가 되고 싶었어요."}, {"en": "I used to ___.", "ko": "예전에 ~하곤 했어요.", "use": {"ko": "예전 습관이나 상태", "en": "Something you did in the past"}, "ex": "I used to draw every day.", "hl": "I used to", "exko": "예전에 매일 그림을 그리곤 했어요."}], builds:[{"ko": "어렸을 때 축구 선수가 되고 싶었어요.", "en": "When I was a kid, I wanted to be a soccer player.", "answer": ["When I was a kid,", "I wanted to be", "a soccer player."], "decoys": ["When I was child", "I want be"]}, {"ko": "예전에 피아노를 치곤 했어요.", "en": "I used to play the piano.", "answer": ["I used", "to play", "the piano."], "decoys": ["I use", "playing"]}], ask:{"q": "What did you want to be when you were a kid?", "qko": "어렸을 때 뭐가 되고 싶었어요?", "must": ["wanted to be", "when i was"], "use": "When I was a kid, I wanted to be ___.", "ex": "When I was a kid, I wanted to be a doctor."}, tip:{"ko": "<b>used to</b> = 예전엔 했지만 지금은 안 함. I used to smoke. (지금은 안 피움)", "en": "<b>used to</b> = you did it before, but not now. I used to smoke."} },
  { id:"u33-work", unit:33, topic:{"ko": "노력하기", "en": "Working toward it"}, chunks:[{"en": "I'm working on ___.", "ko": "~를 열심히 하고 있어요.", "use": {"ko": "노력 중인 것", "en": "What you're working on"}, "ex": "I'm working on my English.", "hl": "I'm working on", "exko": "영어를 열심히 하고 있어요."}, {"en": "It takes time.", "ko": "시간이 걸려요.", "use": {"ko": "쉽지 않다는 걸 말할 때", "en": "Saying it's not quick"}, "ex": "Learning a language takes time.", "hl": "takes time", "exko": "언어를 배우는 건 시간이 걸려요."}], builds:[{"ko": "발음을 열심히 연습하고 있어요.", "en": "I'm working on my pronunciation.", "answer": ["I'm working", "on", "my pronunciation."], "decoys": ["I working", "at to"]}, {"ko": "시간이 걸리지만 괜찮아요.", "en": "It takes time, but that's okay.", "answer": ["It takes time,", "but", "that's okay."], "decoys": ["It needs time", "and"]}], ask:{"q": "What are you working on these days?", "qko": "요즘 뭘 열심히 하고 있어요?", "must": ["working on"], "use": "I'm working on ___.", "ex": "I'm working on my speaking skills."}, tip:{"ko": "언어 공부는 <b>Practice makes perfect.</b> (연습이 완벽을 만든다)!", "en": "Language learning: <b>Practice makes perfect.</b>"} },
  { id:"u33-hope", unit:33, topic:{"ko": "희망", "en": "Hopes for the future"}, chunks:[{"en": "I hope I can ___ someday.", "ko": "언젠가 ~할 수 있으면 좋겠어요.", "use": {"ko": "이루고 싶은 희망", "en": "Something you hope for"}, "ex": "I hope I can visit Europe someday.", "hl": "I hope I can", "exko": "언젠가 유럽에 갈 수 있으면 좋겠어요."}, {"en": "It would be amazing to ___.", "ko": "~하면 정말 멋질 거예요.", "use": {"ko": "상상만 해도 좋은 일", "en": "Imagining something wonderful"}, "ex": "It would be amazing to meet my favorite singer.", "hl": "It would be amazing to", "exko": "좋아하는 가수를 만나면 정말 멋질 거예요."}], builds:[{"ko": "언젠가 집을 살 수 있으면 좋겠어요.", "en": "I hope I can buy a house someday.", "answer": ["I hope", "I can buy a house", "someday."], "decoys": ["I wish", "I could buying"]}, {"ko": "오로라를 보면 정말 멋질 거예요.", "en": "It would be amazing to see the Northern Lights.", "answer": ["It would be", "amazing", "to see the Northern Lights."], "decoys": ["It will", "amazed"]}], ask:{"q": "What would be amazing for you?", "qko": "어떤 일이 생기면 정말 멋질 것 같아요?", "must": ["would be amazing", "i hope"], "use": "It would be amazing to ___.", "ex": "It would be amazing to live in New York."}, tip:{"ko": "<b>hope</b>는 가능한 일, <b>wish</b>는 어려운 일: I hope it's sunny. / I wish I could fly.", "en": "<b>hope</b> = possible. <b>wish</b> = unlikely: I hope it's sunny. / I wish I could fly."} },
  { id:"u33-advice", unit:33, topic:{"ko": "꿈 응원하기", "en": "Supporting dreams"}, chunks:[{"en": "Go for it!", "ko": "해 봐! / 도전해!", "use": {"ko": "도전을 응원할 때", "en": "Encouraging someone to try"}, "ex": "You want to start a YouTube channel? Go for it!", "hl": "Go for it!", "exko": "유튜브 채널 하고 싶다고? 해 봐!"}, {"en": "Never give up.", "ko": "절대 포기하지 마.", "use": {"ko": "힘내라고 할 때", "en": "Encouraging someone not to quit"}, "ex": "It's hard, but never give up.", "hl": "never give up.", "exko": "힘들지만, 절대 포기하지 마."}], builds:[{"ko": "하고 싶으면 해 봐!", "en": "If you want it, go for it!", "answer": ["If you want it,", "go", "for it!"], "decoys": ["go to", "for that!"]}, {"ko": "힘들지만, 절대 포기하지 마.", "en": "It's hard, but never give up.", "answer": ["It's hard,", "but never", "give up."], "decoys": ["but don't never", "give down"]}], ask:{"q": "\"I want to become a singer, but it's hard.\" Encourage your friend.", "qko": "\"나 가수가 되고 싶은데 힘들어.\" 친구를 응원해 보세요.", "must": ["go for it", "never give up", "you can"], "use": "Go for it! Never give up.", "ex": "Go for it! Never give up. You can do it!"}, tip:{"ko": "<b>Go for it!</b>은 \"망설이지 말고 해!\"라는 응원이에요.", "en": "<b>Go for it!</b> means \"Don't hesitate. Do it!\""} },
  { id:"u33-island", unit:33, island:true, uses:["u33-kid", "u33-dream", "u33-work"], topic:{"ko": "꿈 이야기", "en": "Talking about dreams"}, desc:{"ko": "먼저 대화를 들어 보세요 🎧<br>그다음 직접 만들어요!", "en": "Listen to the conversation first 🎧<br>Then build it yourself!"}, dialog:[{"who": "friend", "en": "What did you want to be when you were a kid?", "ko": "어렸을 때 뭐가 되고 싶었어?"}, {"who": "you", "en": "When I was a kid, I wanted to be a singer.", "ko": "어렸을 때 가수가 되고 싶었어."}, {"who": "friend", "en": "Ha ha! And now?", "ko": "하하! 지금은?"}, {"who": "you", "en": "Now, my dream is to work abroad.", "ko": "지금 내 꿈은 해외에서 일하는 거야."}, {"who": "you", "en": "I'm working on my English every day.", "ko": "매일 영어를 열심히 하고 있어."}, {"who": "friend", "en": "Go for it! You can do it!", "ko": "해 봐! 넌 할 수 있어!"}], builds:[{"ko": "어렸을 때 가수가 되고 싶었어.", "en": "When I was a kid, I wanted to be a singer.", "answer": ["When I was a kid,", "I wanted to be", "a singer."], "decoys": ["I want be"]}, {"ko": "지금 내 꿈은 해외에서 일하는 거야.", "en": "Now, my dream is to work abroad.", "answer": ["Now, my dream", "is to", "work abroad."], "decoys": ["working"]}, {"ko": "매일 영어를 열심히 하고 있어.", "en": "I'm working on my English every day.", "answer": ["I'm working on", "my English", "every day."], "decoys": ["at to"]}], tip:{"ko": "🏝️ 이제 영어로 내 꿈을 자신 있게 말할 수 있어요!", "en": "🏝️ You can now talk about your dreams with confidence!"} },
  { id:"u34-so", unit:34, topic:{"ko": "그래서", "en": "Results"}, chunks:[{"en": "___, so ___.", "ko": "~해서, ~했어요.", "use": {"ko": "원인과 결과", "en": "Cause and result"}, "ex": "It was raining, so I stayed home.", "hl": "so", "exko": "비가 와서 집에 있었어요."}, {"en": "That's why ___.", "ko": "그래서 ~한 거예요.", "use": {"ko": "이유를 정리할 때", "en": "Wrapping up a reason"}, "ex": "I missed the bus. That's why I'm late.", "hl": "That's why", "exko": "버스를 놓쳤어요. 그래서 늦은 거예요."}], builds:[{"ko": "피곤해서 일찍 잤어요.", "en": "I was tired, so I went to bed early.", "answer": ["I was tired,", "so I went", "to bed early."], "decoys": ["so I go", "for bed"]}, {"ko": "그래서 영어를 공부하는 거예요.", "en": "That's why I'm studying English.", "answer": ["That's why", "I'm studying", "English."], "decoys": ["That's because", "study"]}], ask:{"q": "Why are you learning English? Use \"so\" or \"That's why.\"", "qko": "왜 영어를 배워요? \"so\"나 \"That's why\"를 써 보세요.", "must": ["so", "that is why"], "use": "I want to ___, so I'm learning English.", "ex": "I want to travel, so I'm learning English."}, tip:{"ko": "<b>because</b>는 이유, <b>so</b>는 결과! I stayed home because it rained. / It rained, so I stayed home.", "en": "<b>because</b> → reason. <b>so</b> → result. I stayed home because it rained. / It rained, so I stayed home."} },
  { id:"u34-tobe", unit:34, topic:{"ko": "~하려고", "en": "In order to"}, chunks:[{"en": "I'm ___ to ___.", "ko": "~하려고 ~하고 있어요.", "use": {"ko": "목적을 말할 때", "en": "Saying your purpose"}, "ex": "I'm saving money to buy a car.", "hl": "to buy", "exko": "차를 사려고 돈을 모으고 있어요."}, {"en": "The reason is ___.", "ko": "이유는 ~예요.", "use": {"ko": "이유를 분명히 말할 때", "en": "Stating the reason clearly"}, "ex": "The reason is simple. I love it.", "hl": "The reason is", "exko": "이유는 간단해요. 저는 그게 좋아요."}], builds:[{"ko": "살 빼려고 운동하고 있어요.", "en": "I'm working out to lose weight.", "answer": ["I'm working out", "to lose", "weight."], "decoys": ["for lose", "weights"]}, {"ko": "이유는 시간이 없기 때문이에요.", "en": "The reason is I don't have time.", "answer": ["The reason is", "I don't have", "time."], "decoys": ["The reason is because of", "haven't"]}], ask:{"q": "Why do you get up early?", "qko": "왜 일찍 일어나요?", "must": ["to", "the reason", "because"], "use": "I get up early to ___.", "ex": "I get up early to study English."}, tip:{"ko": "목적을 말할 땐 for + 동사 ❌, <b>to + 동사</b> ✅: I came here to study.", "en": "For purpose, use <b>to + verb</b>, not \"for\": I came here to study."} },
  { id:"u34-change", unit:34, topic:{"ko": "계획 변경", "en": "Changing plans"}, chunks:[{"en": "Something came up.", "ko": "일이 좀 생겼어요.", "use": {"ko": "갑자기 약속을 취소할 때", "en": "When plans suddenly change"}, "ex": "Sorry, something came up.", "hl": "something came up.", "exko": "미안해, 일이 좀 생겼어."}, {"en": "Can we reschedule?", "ko": "일정 다시 잡을 수 있을까요?", "use": {"ko": "약속을 미룰 때", "en": "Moving plans to another time"}, "ex": "Can we reschedule for next week?", "hl": "Can we reschedule", "exko": "다음 주로 일정 다시 잡을 수 있을까요?"}], builds:[{"ko": "미안, 일이 좀 생겼어.", "en": "Sorry, something came up.", "answer": ["Sorry,", "something", "came up."], "decoys": ["something happened", "come up"]}, {"ko": "금요일로 일정 다시 잡을 수 있을까요?", "en": "Can we reschedule for Friday?", "answer": ["Can we", "reschedule", "for Friday?"], "decoys": ["Could we", "delay to"]}], ask:{"q": "You have to cancel lunch with a friend. Text them.", "qko": "친구와의 점심 약속을 취소해야 해요. 문자를 보내 보세요.", "must": ["came up", "reschedule"], "use": "Something came up. Can we reschedule?", "ex": "Sorry, something came up. Can we reschedule?"}, tip:{"ko": "이유를 자세히 말하기 싫을 때 <b>Something came up</b>이 딱이에요.", "en": "<b>Something came up</b> is perfect when you don't want to explain details."} },
  { id:"u34-instead", unit:34, topic:{"ko": "대신", "en": "Instead"}, chunks:[{"en": "Let's ___ instead.", "ko": "대신 ~하자.", "use": {"ko": "다른 계획을 제안할 때", "en": "Suggesting another plan"}, "ex": "It's raining. Let's watch a movie instead.", "hl": "instead", "exko": "비 온다. 대신 영화 보자."}, {"en": "How about ___ instead?", "ko": "대신 ~는 어때요?", "use": {"ko": "대안을 물어볼 때", "en": "Offering an alternative"}, "ex": "How about Saturday instead?", "hl": "How about", "exko": "대신 토요일은 어때요?"}], builds:[{"ko": "대신 집에서 먹자.", "en": "Let's eat at home instead.", "answer": ["Let's eat", "at home", "instead."], "decoys": ["Let's eating", "in home"]}, {"ko": "대신 다음 주는 어때?", "en": "How about next week instead?", "answer": ["How about", "next week", "instead?"], "decoys": ["What about", "next weeks"]}], ask:{"q": "The beach trip is canceled because of the rain. Suggest another plan.", "qko": "비 때문에 해변 여행이 취소됐어요. 다른 계획을 제안해 보세요.", "must": ["instead", "how about", "let us"], "use": "Let's ___ instead.", "ex": "Let's go to a café instead."}, tip:{"ko": "<b>instead</b>는 보통 문장 끝에 와요: Let's go tomorrow instead.", "en": "<b>instead</b> usually goes at the end: Let's go tomorrow instead."} },
  { id:"u34-decide", unit:34, topic:{"ko": "결정하기", "en": "Making decisions"}, chunks:[{"en": "I've decided to ___.", "ko": "~하기로 했어요.", "use": {"ko": "결정한 일을 말할 때", "en": "Sharing a decision"}, "ex": "I've decided to quit my job.", "hl": "I've decided to", "exko": "회사를 그만두기로 했어요."}, {"en": "I'm still deciding.", "ko": "아직 고민 중이에요.", "use": {"ko": "결정을 못 했을 때", "en": "When you haven't decided yet"}, "ex": "I'm still deciding. It's a big decision.", "hl": "I'm still deciding.", "exko": "아직 고민 중이에요. 큰 결정이라서요."}], builds:[{"ko": "일본어를 배우기로 했어요.", "en": "I've decided to learn Japanese.", "answer": ["I've decided", "to learn", "Japanese."], "decoys": ["I decided", "learning"]}, {"ko": "아직 고민 중이에요.", "en": "I'm still deciding.", "answer": ["I'm", "still", "deciding."], "decoys": ["I still", "decide"]}], ask:{"q": "Tell me about a decision you made recently.", "qko": "최근에 내린 결정에 대해 말해 주세요.", "must": ["decided to", "still deciding"], "use": "I've decided to ___.", "ex": "I've decided to move to Seoul."}, tip:{"ko": "결정을 다시 생각할 땐 <b>I changed my mind.</b> (마음이 바뀌었어요)", "en": "If you rethink it: <b>I changed my mind.</b>"} },
  { id:"u34-island", unit:34, island:true, uses:["u34-change", "u34-instead", "u34-so"], topic:{"ko": "약속 변경", "en": "Changing plans with a friend"}, desc:{"ko": "먼저 대화를 들어 보세요 🎧<br>그다음 직접 만들어요!", "en": "Listen to the conversation first 🎧<br>Then build it yourself!"}, dialog:[{"who": "you", "en": "Hey, sorry. Something came up.", "ko": "야, 미안. 일이 좀 생겼어."}, {"who": "friend", "en": "Oh no. What happened?", "ko": "헐. 무슨 일이야?"}, {"who": "you", "en": "I have to work late, so I can't make it tonight.", "ko": "늦게까지 일해야 해서 오늘 밤에 못 가."}, {"who": "you", "en": "Can we reschedule? How about Saturday instead?", "ko": "일정 다시 잡을 수 있을까? 대신 토요일 어때?"}, {"who": "friend", "en": "Sure, Saturday works!", "ko": "그래, 토요일 좋아!"}, {"who": "you", "en": "Thanks! See you then.", "ko": "고마워! 그때 보자."}], builds:[{"ko": "야, 미안. 일이 좀 생겼어.", "en": "Hey, sorry. Something came up.", "answer": ["Hey, sorry.", "Something", "came up."], "decoys": ["happened"]}, {"ko": "늦게까지 일해야 해서 오늘 밤에 못 가.", "en": "I have to work late, so I can't make it tonight.", "answer": ["I have to work late,", "so I can't", "make it tonight."], "decoys": ["because"]}, {"ko": "일정 다시 잡을 수 있을까? 대신 토요일 어때?", "en": "Can we reschedule? How about Saturday instead?", "answer": ["Can we reschedule?", "How about Saturday", "instead?"], "decoys": ["delay"]}], tip:{"ko": "🏝️ 이제 영어로 이유를 말하고 계획을 바꿀 수 있어요!", "en": "🏝️ You can now explain reasons and change plans in English!"} },
  { id:"u35-intro", unit:35, topic:{"ko": "면접 자기소개", "en": "Introducing yourself in an interview"}, chunks:[{"en": "I have ___ years of experience in ___.", "ko": "~ 분야에서 ~년 경력이 있어요.", "use": {"ko": "경력을 말할 때", "en": "Talking about your experience"}, "ex": "I have three years of experience in sales.", "hl": "years of experience in", "exko": "영업 분야에서 3년 경력이 있어요."}, {"en": "I'm good at ___.", "ko": "저는 ~를 잘해요.", "use": {"ko": "강점을 말할 때", "en": "Talking about your strengths"}, "ex": "I'm good at working with people.", "hl": "I'm good at", "exko": "저는 사람들과 일하는 걸 잘해요."}], builds:[{"ko": "마케팅 분야에서 5년 경력이 있어요.", "en": "I have five years of experience in marketing.", "answer": ["I have five years", "of experience", "in marketing."], "decoys": ["I has", "experiences"]}, {"ko": "저는 문제 해결을 잘해요.", "en": "I'm good at solving problems.", "answer": ["I'm good at", "solving", "problems."], "decoys": ["I'm good", "solve"]}], ask:{"q": "\"Tell me about yourself.\" Answer the interviewer.", "qko": "\"자기소개 해 주세요.\" 면접관에게 대답해 보세요.", "must": ["experience", "good at", "i am"], "use": "I have ___ years of experience in ___. I'm good at ___.", "ex": "I have two years of experience in teaching. I'm good at explaining things."}, tip:{"ko": "면접에선 짧고 분명하게! 경력 → 강점 → 지원 이유 순서로 말해요.", "en": "Keep interview answers short: experience → strengths → why you applied."} },
  { id:"u35-why", unit:35, topic:{"ko": "지원 동기", "en": "Why you want the job"}, chunks:[{"en": "I'm interested in ___.", "ko": "~에 관심이 있어요.", "use": {"ko": "관심 분야를 말할 때", "en": "Saying what interests you"}, "ex": "I'm interested in this position.", "hl": "I'm interested in", "exko": "이 직무에 관심이 있어요."}, {"en": "I'd like to grow ___.", "ko": "~로 성장하고 싶어요.", "use": {"ko": "성장 목표를 말할 때", "en": "Saying how you want to grow"}, "ex": "I'd like to grow with this company.", "hl": "I'd like to grow", "exko": "이 회사와 함께 성장하고 싶어요."}], builds:[{"ko": "디자인에 관심이 있어요.", "en": "I'm interested in design.", "answer": ["I'm interested", "in", "design."], "decoys": ["I'm interesting", "at"]}, {"ko": "이 회사와 함께 성장하고 싶어요.", "en": "I'd like to grow with this company.", "answer": ["I'd like", "to grow", "with this company."], "decoys": ["I like", "growing"]}], ask:{"q": "\"Why do you want to work here?\" Answer.", "qko": "\"왜 여기서 일하고 싶어요?\" 대답해 보세요.", "must": ["interested in", "would like to", "like to"], "use": "I'm interested in ___.", "ex": "I'm interested in your products, and I'd like to grow with this team."}, tip:{"ko": "❌ I'm interesting in design. (내가 흥미로운 사람)<br>✅ <b>I'm interested in</b> design.", "en": "❌ I'm interesting in design. (= you are an interesting person)<br>✅ <b>I'm interested in</b> design."} },
  { id:"u35-weak", unit:35, topic:{"ko": "약점", "en": "Your weakness"}, chunks:[{"en": "My weakness is ___.", "ko": "제 약점은 ~예요.", "use": {"ko": "약점을 말할 때", "en": "Talking about a weakness"}, "ex": "My weakness is public speaking.", "hl": "My weakness is", "exko": "제 약점은 사람들 앞에서 말하는 거예요."}, {"en": "But I'm working on it.", "ko": "하지만 고치려고 노력 중이에요.", "use": {"ko": "개선 중이라고 할 때", "en": "Showing you're improving"}, "ex": "But I'm working on it every day.", "hl": "But I'm working on it", "exko": "하지만 매일 고치려고 노력 중이에요."}], builds:[{"ko": "제 약점은 너무 꼼꼼한 거예요.", "en": "My weakness is that I'm too detail-oriented.", "answer": ["My weakness is", "that I'm", "too detail-oriented."], "decoys": ["My weak is", "I am too much"]}, {"ko": "하지만 고치려고 노력 중이에요.", "en": "But I'm working on it.", "answer": ["But", "I'm working", "on it."], "decoys": ["I'm work", "at it"]}], ask:{"q": "\"What's your biggest weakness?\" Answer the interviewer.", "qko": "\"가장 큰 약점이 뭐예요?\" 면접관에게 대답해 보세요.", "must": ["weakness", "working on"], "use": "My weakness is ___. But I'm working on it.", "ex": "My weakness is time management. But I'm working on it."}, tip:{"ko": "약점 + <b>But I'm working on it</b>을 붙이면 긍정적으로 들려요.", "en": "Add <b>But I'm working on it</b> after a weakness to sound positive."} },
  { id:"u35-meeting", unit:35, topic:{"ko": "회의에서", "en": "In meetings"}, chunks:[{"en": "Can I add something?", "ko": "하나 덧붙여도 될까요?", "use": {"ko": "회의에서 말을 꺼낼 때", "en": "Joining in during a meeting"}, "ex": "Sorry, can I add something?", "hl": "can I add something?", "exko": "죄송한데, 하나 덧붙여도 될까요?"}, {"en": "Let me check and get back to you.", "ko": "확인하고 다시 알려 드릴게요.", "use": {"ko": "바로 답하기 어려울 때", "en": "When you need time to answer"}, "ex": "Good question. Let me check and get back to you.", "hl": "Let me check and get back to you.", "exko": "좋은 질문이에요. 확인하고 다시 알려 드릴게요."}], builds:[{"ko": "하나 덧붙여도 될까요?", "en": "Can I add something?", "answer": ["Can I", "add", "something?"], "decoys": ["Could I", "plus something"]}, {"ko": "확인하고 다시 알려 드릴게요.", "en": "Let me check and get back to you.", "answer": ["Let me check", "and get back", "to you."], "decoys": ["Let me checking", "return"]}], ask:{"q": "Your manager asks you a question in a meeting. You don't know the answer yet.", "qko": "회의에서 팀장님이 질문했는데 아직 답을 몰라요.", "must": ["get back to you", "let me check"], "use": "Let me check and get back to you.", "ex": "That's a good question. Let me check and get back to you."}, tip:{"ko": "<b>get back to you</b>는 \"나중에 다시 연락 드릴게요\"라는 비즈니스 필수 표현이에요.", "en": "<b>get back to you</b> = \"I'll reply later.\" A must-know at work."} },
  { id:"u35-email", unit:35, topic:{"ko": "업무 이메일", "en": "Work emails"}, chunks:[{"en": "I'm writing to ___.", "ko": "~하려고 연락드려요.", "use": {"ko": "이메일 첫 문장", "en": "The first line of an email"}, "ex": "I'm writing to ask about the meeting.", "hl": "I'm writing to", "exko": "회의에 대해 여쭤보려고 연락드려요."}, {"en": "Please let me know if ___.", "ko": "~하면 알려 주세요.", "use": {"ko": "이메일 마무리", "en": "Ending an email"}, "ex": "Please let me know if you have any questions.", "hl": "Please let me know if", "exko": "궁금한 점이 있으면 알려 주세요."}], builds:[{"ko": "일정을 확인하려고 연락드려요.", "en": "I'm writing to confirm the schedule.", "answer": ["I'm writing", "to confirm", "the schedule."], "decoys": ["I write", "for confirm"]}, {"ko": "궁금한 점이 있으면 알려 주세요.", "en": "Please let me know if you have any questions.", "answer": ["Please let me know", "if you have", "any questions."], "decoys": ["Please know me", "when you have"]}], ask:{"q": "Start a work email to ask about a project.", "qko": "프로젝트에 대해 묻는 업무 이메일을 시작해 보세요.", "must": ["writing to", "let me know"], "use": "I'm writing to ___.", "ex": "Hi, I'm writing to ask about the new project."}, tip:{"ko": "이메일 끝인사는 <b>Best regards,</b> 또는 <b>Thanks,</b>가 무난해요.", "en": "Safe ways to end an email: <b>Best regards,</b> or <b>Thanks,</b>"} },
  { id:"u35-island", unit:35, island:true, uses:["u35-intro", "u35-why", "u35-weak"], topic:{"ko": "영어 면접", "en": "An English job interview"}, desc:{"ko": "먼저 대화를 들어 보세요 🎧<br>그다음 직접 만들어요!", "en": "Listen to the conversation first 🎧<br>Then build it yourself!"}, dialog:[{"who": "interviewer", "en": "Thanks for coming. Tell me about yourself.", "ko": "와 주셔서 감사해요. 자기소개 해 주세요."}, {"who": "you", "en": "I have three years of experience in marketing.", "ko": "마케팅 분야에서 3년 경력이 있어요."}, {"who": "interviewer", "en": "Why do you want to work here?", "ko": "왜 여기서 일하고 싶으세요?"}, {"who": "you", "en": "I'm interested in your products.", "ko": "귀사 제품에 관심이 있어요."}, {"who": "interviewer", "en": "What's your biggest weakness?", "ko": "가장 큰 약점이 뭐예요?"}, {"who": "you", "en": "My weakness is public speaking. But I'm working on it.", "ko": "제 약점은 사람들 앞에서 말하는 거예요. 하지만 고치려고 노력 중이에요."}], builds:[{"ko": "마케팅 분야에서 3년 경력이 있어요.", "en": "I have three years of experience in marketing.", "answer": ["I have three years", "of experience", "in marketing."], "decoys": ["experiences"]}, {"ko": "귀사 제품에 관심이 있어요.", "en": "I'm interested in your products.", "answer": ["I'm interested", "in", "your products."], "decoys": ["interesting"]}, {"ko": "제 약점은 사람들 앞에서 말하는 거예요. 하지만 고치려고 노력 중이에요.", "en": "My weakness is public speaking. But I'm working on it.", "answer": ["My weakness is", "public speaking.", "But I'm working on it."], "decoys": ["My weak"]}], tip:{"ko": "🏝️ 이제 영어 면접도 준비 완료예요!", "en": "🏝️ You're ready for an English job interview!"} },
  { id:"u36-if", unit:36, topic:{"ko": "만약 ~하면", "en": "If... then"}, chunks:[{"en": "If it rains, I'll ___.", "ko": "비가 오면 ~할 거예요.", "use": {"ko": "실제로 일어날 수 있는 일", "en": "Real possibilities"}, "ex": "If it rains, I'll stay home.", "hl": "If it rains", "exko": "비가 오면 집에 있을 거예요."}, {"en": "What will you do if ___?", "ko": "~하면 뭐 할 거예요?", "use": {"ko": "가능한 상황을 물을 때", "en": "Asking about a possible situation"}, "ex": "What will you do if you pass the test?", "hl": "What will you do if", "exko": "시험에 붙으면 뭐 할 거예요?"}], builds:[{"ko": "시간이 있으면 도와줄게.", "en": "If I have time, I'll help you.", "answer": ["If I have time,", "I'll", "help you."], "decoys": ["If I will have", "I help"]}, {"ko": "늦으면 뭐 할 거예요?", "en": "What will you do if you're late?", "answer": ["What will you do", "if", "you're late?"], "decoys": ["What do you will", "when"]}], ask:{"q": "What will you do if it's sunny this weekend?", "qko": "이번 주말에 날씨가 좋으면 뭐 할 거예요?", "must": ["if", "i will"], "use": "If it's sunny, I'll ___.", "ex": "If it's sunny, I'll go hiking."}, tip:{"ko": "if 문장에는 will을 쓰지 않아요: ❌ If it will rain ✅ <b>If it rains</b>, I'll...", "en": "No \"will\" after if: ❌ If it will rain ✅ <b>If it rains</b>, I'll..."} },
  { id:"u36-would", unit:36, topic:{"ko": "상상하기", "en": "Imagining"}, chunks:[{"en": "If I had ___, I would ___.", "ko": "~가 있다면 ~할 텐데.", "use": {"ko": "현실과 다른 상상", "en": "Imagining something unreal"}, "ex": "If I had more time, I would travel.", "hl": "If I had", "exko": "시간이 더 있다면 여행할 텐데."}, {"en": "What would you do if ___?", "ko": "~라면 뭐 할 거예요?", "use": {"ko": "상상 질문", "en": "An imaginary question"}, "ex": "What would you do if you won the lottery?", "hl": "What would you do if", "exko": "복권에 당첨되면 뭐 할 거예요?"}], builds:[{"ko": "차가 있다면 매일 운전할 텐데.", "en": "If I had a car, I would drive every day.", "answer": ["If I had a car,", "I would drive", "every day."], "decoys": ["If I have a car", "I will"]}, {"ko": "투명 인간이 된다면 뭐 할 거예요?", "en": "What would you do if you were invisible?", "answer": ["What would you do", "if you were", "invisible?"], "decoys": ["What will you", "if you are"]}], ask:{"q": "What would you do if you won the lottery?", "qko": "복권에 당첨되면 뭐 할 거예요?", "must": ["i would", "i would buy", "if i"], "use": "If I won the lottery, I would ___.", "ex": "If I won the lottery, I would buy a house for my parents."}, tip:{"ko": "상상일 땐 과거형을 써요: <b>If I had</b> money, I <b>would</b>... (지금 돈이 없다는 뜻)", "en": "For imagination, use the past: <b>If I had</b> money, I <b>would</b>... (= I don't have money now)"} },

function tone(freq,dur,type="sine",vol=.15,delay=0){
  const c=ac(); if(!c) return;
  try{ const o=c.createOscillator(), g=c.createGain(), t0=c.currentTime+delay;
    o.type=type; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+.02); }catch(e){}
}

function confetti(){
  const cv=$("confetti"), cx=cv.getContext("2d"); cv.width=innerWidth; cv.height=innerHeight;
  const cols=["#11A99B","#FF7A1A","#2F80ED","#F2DFB8","#FFC93C"];
  const ps=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;
  (function loop(){ cx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.04; p.r+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore(); });
    if(++f<200) requestAnimationFrame(loop); else cx.clearRect(0,0,cv.width,cv.height); })();
}

const canSpeak = 'speechSynthesis' in window;
const ttsOK = canSpeak || Object.keys(RECORDINGS).length>0;
let voices=[];
function loadVoices(){ try{ voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)); }catch(e){ voices=[]; } }
if(canSpeak){ loadVoices(); try{ speechSynthesis.onvoiceschanged=loadVoices; }catch(e){} }
function pickVoice(i){ const us=voices.filter(v=>/US/i.test(v.lang)); const pool=us.length>=2?us:voices; return pool.length?pool[i%pool.length]:null; }
function clean(text){ return text.replace(/\s*_+\s*/g," ").replace(/\.\.\.,?/g,"").replace(/\s+([?.!,])/g,"$1").replace(/\s+/g," ").trim(); }
let heardCount=0, curAudio=null, sayToken=0;
/* one shared player, unlocked on the first tap so phones allow later auto-play */
const player=new Audio(); player.preload="auto";
document.addEventListener("pointerdown",function unlock(){ try{ if(!player.src){ player.src="data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//OEwAAAAAAAAAAAAEluZm8AAAAPAAAABQAAAqAAbW1tbW1tbW1tbW1tbW1tbW1tbZKSkpKSkpKSkpKSkpKSkpKSkpKStra2tra2tra2tra2tra2tra2trbb29vb29vb29vb29vb29vb29vb2///////////////////////////AAAAAExhdmM2MC4zMQAAAAAAAAAAAAAAACQEUAAAAAAAAAKgvT9A1gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//NExAAAAANIAAAAAExBTUUzLjEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExFMAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExKYAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NExKwAAANIAAAAAFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NExKwAAANIAAAAAFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV"; player.play().then(()=>{ if(player.src.startsWith("data:")) player.pause(); }).catch(()=>{}); } }catch(e){} document.removeEventListener("pointerdown",unlock,true); },true);
function stopAudio(){ talkOff(); sayToken++; try{ if(canSpeak) speechSynthesis.cancel(); }catch(e){} if(curAudio){ try{curAudio.pause();}catch(e){} curAudio=null; } }
/* speak(text, {onEnd, voice}) — voice 0 = main, 1 = other person */
function speak(text, opts={}){
  if(opts.voice===undefined) opts.voice=voiceFor(text);
  const onEnd=opts.onEnd, myTok=++sayToken, rate=S.speed==="slow"?.8:1.0;
  talkOff();
  const who = opts.el || document.querySelector(".stage.show .scene .char");
  if(who && !opts.el) setChar(who, opts.voice===1 ? "alex" : "minji");
  if(who) who.classList.add("talking");
  let ended=false; const done=()=>{ if(who) who.classList.remove("talking"); if(ended||myTok!==sayToken) return; ended=true; onEnd&&onEnd(); };
  heardCount++;
  try{ if(canSpeak) speechSynthesis.cancel(); }catch(e){} if(curAudio){ try{curAudio.pause();}catch(e){} curAudio=null; }
  const rec = (opts.voice===1 && RECORDINGS["2|"+clean(text)]) || RECORDINGS[text] || RECORDINGS[clean(text)];
  if(rec){
    try{ const a=player; a.onended=null; a.onerror=null; a.src=rec; a.playbackRate=S.speed==="slow"?.85:1; a.onended=done; a.onerror=()=>{ if(myTok===sayToken) ttsSay(); }; curAudio=a; a.play().catch(()=>{ if(myTok===sayToken) ttsSay(); }); }catch(e){ ttsSay(); }
  } else ttsSay();
  function ttsSay(){
    const words=clean(text).split(" ").length;
    setTimeout(done, (words*550/rate)+1200); // safety net if onend never fires
    if(!canSpeak) return;
    try{ const u=new SpeechSynthesisUtterance(clean(text)); u.lang="en-US"; u.rate=rate;
      const v=pickVoice(opts.voice||0); if(v) u.voice=v;
      if((opts.voice||0)===1 && !(pickVoice(1) && pickVoice(1)!==pickVoice(0))) u.pitch=1.35;
      u.onend=done; u.onerror=done; speechSynthesis.speak(u); }catch(e){}
  }
}

/* =========================================================
   AUDIO IN: microphone (shared by repeat, speak and ask)
   1) Claude "dictation" (inside claude.ai)  2) browser SpeechRecognition (own website)
   ========================================================= */
let dict=null, dictReady=false;
let refreshCurrentMic=()=>{};
function refreshMicUI(){ refreshCurrentMic(); }
(async()=>{ try{ if(window.claude && window.claude.use){ dict=await window.claude.use("dictation"); } }catch(e){ dict=null; } dictReady=true; refreshMicUI(); })();
setTimeout(()=>{ if(!dictReady){ dictReady=true; refreshMicUI(); } },11000);
const NativeSR = window.SpeechRecognition || window.webkitSpeechRecognition;
let heardAlts=""; let micCtx=null, micLive=false, heardF="", heardP="", rec=null, micBlocked=false, dictWired=false;
const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
let micPerm=false, mediaRec=null;
function engine(){ if(dict) return "dict"; if(micBlocked) return null; if(NativeSR) return "native"; if(canRecord) return "rec"; return null; }
function micAvailable(){ return !!engine() || (micBlocked && (NativeSR || canRecord)); }
/* ask the browser for the mic up front, so the permission popup always shows */
async function ensureMicPerm(){
  if(micPerm || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return true;
  try{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(tr=>tr.stop()); micPerm=true; return true; }
  catch(err){ if(err && (err.name==="NotAllowedError"||err.name==="SecurityError"||err.name==="PermissionDeniedError")) micBlocked=true; return false; }
}
function micPending(){ return !engine() && !dictReady && !!window.claude; }
/* respond the moment they get it right: no second tap needed */
let autoT=null;
function showHeard(){
  if(!micCtx) return;
  const txt=(heardF+" "+heardP).trim(); micCtx.heard.textContent=txt;
  clearTimeout(autoT); if(!txt || !micLive) return;
  const v = micCtx.judge ? micCtx.judge(txt) : 0;   // 2 = all correct, 1 = good enough, 0 = not yet
  if(v===2) return finishNow();
  // not right yet: answer fast once they've clearly finished, but don't cut off someone mid-sentence
  const said=wordsRaw(txt).length, need=micCtx.targetLen||0, final=!heardP;
  const wait = v===1 ? 800 : (need && said>=need) ? 600 : final ? 900 : 1500;
  autoT=setTimeout(()=>{ if(micLive && micCtx) finishNow(); }, wait);
}
/* 2 = every word said (finish now), 1 = close enough (finish after a short pause), 0 = keep listening */
function judgeSentence(target, txt){ const p=scoreAgainst(target,txt).pct; const full=wordsRaw(txt).length>=wordsRaw(target).length; return p>=100 ? (full?2:1) : p>=70 ? 1 : 0; }
function finishNow(){
  clearTimeout(autoT); const c=micCtx; if(!c || !micLive) return;
  const txt=(heardF+" "+heardP).trim();
  setMicLive(false);
  try{ if(dict) dict.stop(); else if(rec) rec.abort(); }catch(e){}
  c.onResult(txt);
}
function setMicLive(on){ micLive=on; if(micCtx){ micCtx.btn.classList.toggle("live",on); micCtx.onLive&&micCtx.onLive(on); } }
function micEnded(){ const c=micCtx; setMicLive(false); if(c) c.onResult((heardF+" "+heardP).trim()); }
function micStart(ctx){
  if(micLive){ micStop(); return; }
  if(micBlocked && !dict){ micBlocked=false; micPerm=false; } // let them retry after fixing the setting
  const e=engine(); if(!e) return;
  clearTimeout(autoT); stopAudio(); micCtx=ctx; heardF=""; heardP=""; heardAlts=""; ctx.heard.innerHTML="";
  const denied=()=>{ setMicLive(false); micBlocked=true; refreshMicUI(); toast(t().micDenied); track("mic_denied",{engine:e}); };
  if(e==="dict"){
    if(!dictWired){
      dict.onPartial(({text})=>{ heardP=text||""; showHeard(); });
      dict.onFinal(({text})=>{ heardF=(heardF+" "+(text||"")).trim(); heardP=""; showHeard(); });
      dict.onState(({state})=>{ if(state==="listening") setMicLive(true); else if(micLive) micEnded(); });
      dictWired=true;
    }
    setMicLive(true);
    dict.start().catch(err=>{ setMicLive(false); const r=String(err&&(err.reason||err.message||err)); if(r.includes("not_granted")){ dict=null; micBlocked=true; } refreshMicUI(); });
  } else if(e==="native"){
    setMicLive(true);
    ensureMicPerm().then(ok=>{
      if(micCtx!==ctx || !micLive) return;
      if(!ok){ if(micBlocked) return denied(); }
      try{
        rec=new NativeSR(); rec.lang="en-US"; rec.interimResults=true; rec.continuous=!!ctx.long; rec.maxAlternatives=5;
        rec.onresult=ev=>{ let f="",p="",alts=[]; for(const r of ev.results){ if(r.isFinal){ f+=r[0].transcript+" "; for(let j=1;j<r.length;j++) alts.push(r[j].transcript); } else p+=r[0].transcript; } heardF=f.trim(); heardP=p; heardAlts=alts.join(" "); showHeard(); };
        rec.onerror=ev=>{ if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){ micBlocked=true; } };
        rec.onend=()=>{ if(micLive){ if(micBlocked){ denied(); } else micEnded(); } };
        rec.start();
      }catch(err){ denied(); }
    });
  } else { // "rec": no speech recognition here, so record and play back for a self-check
    setMicLive(true);
    navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
      micPerm=true;
      if(micCtx!==ctx || !micLive){ stream.getTracks().forEach(tr=>tr.stop()); return; }
      const chunks=[]; mediaRec=new MediaRecorder(stream);
      mediaRec.ondataavailable=ev=>{ if(ev.data && ev.data.size) chunks.push(ev.data); };
      mediaRec.onstop=()=>{
        stream.getTracks().forEach(tr=>tr.stop());
        const c=micCtx; const mr=mediaRec; mediaRec=null; setMicLive(false);
        if(!c || !chunks.length) return;
        try{ const a=new Audio(URL.createObjectURL(new Blob(chunks,{type:(mr&&mr.mimeType)||"audio/webm"}))); a.play().catch(()=>{}); }catch(_){}
        c.onSelf ? c.onSelf() : c.onResult("");
      };
      mediaRec.start();
      setTimeout(()=>{ if(mediaRec && mediaRec.state==="recording" && micCtx===ctx) mediaRec.stop(); },12000);
    }).catch(err=>{ if(err && (err.name==="NotAllowedError"||err.name==="SecurityError")) denied(); else { setMicLive(false); refreshMicUI(); } });
  }
}
async function micStop(){ try{ if(dict) await dict.stop(); else if(mediaRec && mediaRec.state==="recording") mediaRec.stop(); else if(rec) rec.stop(); else micEnded(); }catch(e){ micEnded(); } }
function micAbort(){ clearTimeout(autoT); micCtx=null; if(micLive){ micLive=false; try{ if(dict) dict.stop(); else if(mediaRec && mediaRec.state==="recording") mediaRec.stop(); else if(rec) rec.abort(); }catch(e){} } }

/* speech scoring */
const CONTR={"i'm":"i am","it's":"it is","there's":"there is","what's":"what is","let's":"let us","don't":"do not","can't":"can not","cannot":"can not","you're":"you are","gonna":"going to","wanna":"want to","where's":"where is","that's":"that is","i'll":"i will","we'll":"we will","you'll":"you will","how's":"how is","i'd":"i would","isn't":"is not","didn't":"did not","doesn't":"does not","won't":"will not","i've":"i have","wasn't":"was not","weren't":"were not","aren't":"are not","haven't":"have not","hasn't":"has not","you've":"you have","we've":"we have","they've":"they have","we're":"we are","they're":"they are","he's":"he is","she's":"she is","shouldn't":"should not","couldn't":"could not","wouldn't":"would not","you'd":"you would","it'll":"it will","that'll":"that will","who's":"who is","here's":"here is","let's":"let us","i'd've":"i would have"};
/* sound-alikes and number words the recognizer mixes up, compared on both sides */
const HOMO={too:"to",two:"to","2":"to",four:"for","4":"for",their:"there",write:"right",sea:"see",high:"hi",bye:"by",buy:"by",know:"no",hour:"our",weak:"week",meat:"meet",hear:"here",won:"1",one:"1",ate:"8",eight:"8",okay:"ok",zero:"0",three:"3",five:"5",six:"6",seven:"7",nine:"9",ten:"10",eleven:"11",twelve:"12",alright:"all right"};
/* names the recognizer often misspells: never mark them wrong */
const NAMES=new Set(["alex","minji","junho","busan","gangnam","hongdae","jeju","incheon","lotte","kim","lee","park","bts","tteokbokki","bibimbap"]);
function wordsRaw(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[’‘]/g,"'").replace(/\bk[\s-]+(pop|dramas?)\b/g,"k$1").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean).flatMap(w=>(CONTR[w]||w).split(" ")); }
function canon(w){ return HOMO[w]||w; }
function words(s){ return wordsRaw(s).flatMap(w=>canon(w).split(" ")); }
function scoreAgainst(targetText, said){
  const bag={};
  words(said+" "+heardAlts).forEach(w=>bag[w]=(bag[w]||0)+1);
  const marks=wordsRaw(targetText).map(w=>{ const c=canon(w); if(NAMES.has(w)) return [w,true]; if(bag[c]){ bag[c]--; return [w,true]; } return [w,false]; });
  return {marks, pct:marks.length?Math.round(100*marks.filter(m=>m[1]).length/marks.length):0};
}
function markHTML(marks){ return marks.map(([w,ok])=>`<span class="w ${ok?'ok':'miss'}">${esc(w)}</span>`).join(" "); }

/* ===== mascot: happy, cheer, sad, wow ===== */
function mascotSVG(mood){
  const ink="#14213D";
  const mouth = mood==="sad" ? `<path d="M22.5 27 q4.5 -3.5 9 0" stroke="${ink}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`
    : mood==="wow" ? `<ellipse cx="27" cy="26" rx="2.8" ry="3.4" fill="${ink}"/>`
    : mood==="cheer" ? `<path d="M21.5 23.5 q5.5 7 11 0 z" fill="${ink}"/><path d="M24 26.5 q3 2 6 0" fill="#FF8A7A"/>`
    : `<path d="M22.5 24.5 q4.5 3.6 9 0" stroke="${ink}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  const brows = mood==="sad" ? `<path d="M19 16.5 l5 -2 M35 16.5 l-5 -2" stroke="${ink}" stroke-width="1.8" stroke-linecap="round"/>` : "";
  const arms = mood==="cheer" ? `<path d="M15 27 L6 15 M39 27 L48 15" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/><circle cx="6" cy="14" r="2.6" fill="#FFC93C" stroke="${ink}" stroke-width="1.8"/><circle cx="48" cy="14" r="2.6" fill="#FFC93C" stroke="${ink}" stroke-width="1.8"/>`
    : `<path d="M15 30 L10 36 M39 30 L44 36" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/>`;
  return `<svg class="mascot" viewBox="0 0 54 42" aria-hidden="true">${arms}
    <path d="M27 9 q-3 -7 3 -9 q1 6 -3 9" fill="#2EC4A0" stroke="${ink}" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="27" cy="22" r="13" fill="#FFC93C" stroke="${ink}" stroke-width="2.5"/>

    ${brows}${mouth}</svg>`;
}

/* ===== smart review (spaced repetition): each chunk has a box; higher box = longer wait ===== */
const INTERVALS=[0,1,2,4,7,14,30];
const CHUNK_HOME={};
LESSONS.forEach((l,i)=>{ if(!l.island) l.chunks.forEach(c=>{ CHUNK_HOME[c.en]={c, idx:i}; }); });
function srsSet(en, box){ box=Math.max(1,Math.min(6,box)); S.srs[en]={box, due:TODAY+INTERVALS[box]}; }
function srsGrade(en, good){ const r=S.srs[en]; if(!r) return; srsSet(en, good ? r.box+1 : 1); }
function dueList(){
  return Object.entries(S.srs).filter(([en,r])=>r.due<=TODAY && CHUNK_HOME[en])
    .sort((a,b)=>a[1].due-b[1].due || a[1].box-b[1].box).map(([en])=>CHUNK_HOME[en]);
}

function buildSteps(){
  if(L.review){
    const st=[{type:"listen"}];
    L.srcs.forEach((si,k)=>{ const l=LESSONS[si], b=l.builds[Math.floor(Math.random()*l.builds.length)];
      st.push({type:"build", item:b, i:k, n:L.srcs.length, src:si, audio: ttsOK && k%2===1}); });
    return st;
  }
  const idx=LESSONS.indexOf(L), st=[];
  if(L.island){
    st.push({type:"intro"});
    L.builds.forEach((b,i)=>st.push({type:"build",item:b,i,n:L.builds.length}));
    L.builds.forEach((b,i)=>st.push({type:"speak",item:b,island:true,i,n:L.builds.length})); // one short sentence per screen
  } else {
    L.chunks.forEach((_,i)=>st.push({type:"learn",i}));
    st.push({type:"listen"});
    const pr=prevRegular(idx);
    if(pr) st.push({type:"build",item:pr.builds[pr.builds.length-1],review:true});
    st.push({type:"build",item:L.builds[0],i:0,n:L.builds.length});
    st.push({type:"speak",item:L.builds[0],i:0,n:L.builds.length});

let B, BS, picked=[], tries=0, revealed=false, hintedHere=false, peeked=false, revealPending=false;
function renderBuild(st){
  BS=st; B=st.item; picked=[]; tries=0; revealed=false; hintedHere=false; peeked=false; revealPending=false;
  const audio=!!st.audio;
  $("buildLabel").textContent = st.retry ? t().retryLbl : st.review ? t().review : audio ? t().buildAudio : `${t().build} (${st.i+1}/${st.n})`;
  $("ko").style.display = audio ? "none" : "block";

  $("peekBtn").onclick=()=>{ if(!peeked){ peeked=true; hints++; toast(t().hintCost); } $("ko").style.display="block"; $("peekBtn").style.display="none"; };

  $("feedback").textContent=""; $("feedback").className="feedback";
  $("answer").className="answer";

  shuffle([...B.answer,...B.decoys]).forEach(txt=>{ const b=document.createElement("button"); b.className="chunk"; b.textContent=txt; b.onclick=()=>pick(b); bank.appendChild(b); });

}
function renderHearts(){ $("hearts").innerHTML = revealed ? "" : Array.from({length:MAX_TRIES},(_,k)=>`<span class="hrt ${k<MAX_TRIES-tries?"on":""}">${ICON.heart}</span>`).join(""); }
function pick(btn){ if(revealPending) return; const sh=$("fbSheet"); if(sh.classList.contains("bad") && sh.classList.contains("show")){ retryTok++; hideSheet(); clearPicks(); } sfx.pop(); picked.push(btn); btn.classList.add("used"); $("feedback").textContent=""; $("answer").classList.remove("wrong"); renderAnswer(); }
function unpick(idx){ sfx.unpop(); const b=picked.splice(idx,1)[0]; b.classList.remove("used"); renderAnswer(); }
function renderAnswer(){
  const a=$("answer"); a.innerHTML=""; a.classList.remove("reveal");
  if(!picked.length) a.innerHTML=`<span class="ph">${t().tapHint}</span>`;
  picked.forEach((btn,idx)=>{ const c=document.createElement("button"); c.className="chunk"; c.textContent=btn.textContent; c.onclick=()=>unpick(idx); a.appendChild(c); });
  $("checkBtn").disabled=!picked.length;
}
function clearPicks(){ picked.forEach(b=>b.classList.remove("used")); picked=[]; $("answer").classList.remove("wrong"); }
function queueRetry(item){
  if(BS.retry || queued.has(item)) return;
  queued.add(item); steps.push({type:"build", item, retry:true, audio:BS.audio});
}
function check(){
  const guess=picked.map(b=>b.textContent);
  const ok=guess.length===B.answer.length && guess.every((g,i)=>g===B.answer[i]);
  if(ok){
    const clean1 = tries===0 && !revealed;
    allMarks.push(clean1?"🟩":"🟨");
    if(!clean1){ firstTryAll=false; queueRetry(B); }
    if(L.review && BS.src!==undefined && !clean1) LESSONS[BS.src].chunks.forEach(c=>srsGrade(c.en,false));
    $("answer").classList.add("right"); $("feedback").textContent="";
    $("ko").style.display="block"; $("peekBtn").style.display="none";
    if(S.lang==="en") $("gloss").textContent="= "+B.en;
    sfx.right(); setTimeout(()=>speak(B.answer.join(" ")),250);
    $("checkBtn").disabled=true;
    const praise=t().praise[Math.floor(Math.random()*t().praise.length)];
    const mine=BS;
    showSheet("good", praise, B.answer.join(" "), t().cont, ()=>{ if(mine===steps[step]) nextStep(); }, B.answer.join(" "));
    return;
  }
  tries++; mistakes++; noteMiss(B.answer.join(" "), B.ko, B); sfx.wrong(); boatFx("rock"); updateHintLock(); try{navigator.vibrate&&navigator.vibrate(80);}catch(_){}
  const a=$("answer"); a.classList.remove("wrong"); void a.offsetWidth; a.classList.add("wrong");
  if(!revealed && tries>=MAX_TRIES){ doReveal(); return; }
  renderHearts();
  const right=guess.filter((g,i)=>g===B.answer[i]).length;
  $("feedback").textContent="";
  const mine=BS, tok=++retryTok;
  const restart=()=>{ if(mine!==steps[step] || tok!==retryTok) return; retryTok++; hideSheet(); clearPicks(); renderAnswer(); if(BS.audio && tries===2) $("buildPlay").onclick(); };
  showSheet("bad", t().notQuite, right>0 ? t().close(right) : t().retry, t().tryAgain, restart, null);
  // clear the wrong answer right after the shake, then get out of the way on its own
  setTimeout(()=>{ if(mine===steps[step] && tok===retryTok){ clearPicks(); renderAnswer(); } },450);
  setTimeout(restart,1700);
}
let retryTok=0;
function doReveal(){
  revealed=true; revealPending=true; renderHearts();
  clearPicks();
  const a=$("answer"); a.innerHTML=""; a.className="answer reveal";
  B.answer.forEach(x=>{ const c=document.createElement("span"); c.className="chunk"; c.textContent=x; a.appendChild(c); });
  $("ko").style.display="block";
  $("feedback").textContent="";
  $("checkBtn").disabled=true; speak(B.answer.join(" "));
  const mine=BS;
  showSheet("bad", t().answerIs, B.answer.join(" "), t().buildIt, ()=>{ revealPending=false; if(mine!==steps[step]) return; renderAnswer(); $("feedback").className="feedback good"; $("feedback").textContent=t().revealNow; }, B.answer.join(" "));
}
function lessonChunks(lesson){ return lesson.island ? lesson.uses.flatMap(i=>LESSONS[i].chunks) : lesson.chunks; }
function updateHintLock(){ $("hintBtn").classList.toggle("locked", (tries===0 && !revealed) || hintedHere); }
function openHint(){
  if(tries===0 && !revealed && !hintedHere){ toast(t().hintFirst); return; }
  if(hintedHere){ toast(t().hintUsed); return; }
  if(revealPending) return;
  hintedHere=true; hints++; track("hint_used",{lesson:L.id});
  // a small nudge only: start over with the FIRST correct chunk in place
  clearPicks();
  const first=[...$("bank").querySelectorAll(".chunk")].find(b=>b.textContent===B.answer[0]);
  if(first){ picked.push(first); first.classList.add("used"); }
  renderAnswer(); updateHintLock(); sfx.pop();
  $("feedback").className="feedback good"; $("feedback").textContent=t().hintGiven;
  toast(t().hintCost);
}

  $("heard").innerHTML=""; $("spFeedback").textContent=""; $("spFeedback").className="feedback";
  $("exAns").classList.remove("show");
  if(exAns){ $("exAnsLbl").textContent=t().exAns; $("exAnsTxt").textContent=exAns; $("sayExAns").onclick=()=>speak(exAns); }
  $("spActions").style.display="none"; $("spNext").textContent=t().cont; $("spSkip").textContent=t().skip;
  const mic=$("micBtn"); mic.classList.remove("live");
  const ctx={btn:mic, heard:$("heard"), long: !!exAns || en.split(" ").length>7, judge, targetLen, onLive:on=>{ $("micHint").textContent=on?t().micLive:t().micTap; }, onResult,
    onSelf:()=>{ const fb=$("spFeedback"); fb.className="feedback good"; fb.textContent=t().selfDone; sfx.right(); if(!selfCounted){ selfCounted=true; spoken++; } $("spActions").style.display="flex"; if(exAns) $("exAns").classList.add("show"); }};
  let selfCounted=false;
  mic.onclick=()=>micStart(ctx);
  refreshCurrentMic=()=>{
    if(micLive) return;
    const e=engine();
    if(micPending()){ mic.disabled=true; $("micHint").textContent=t().micWait; return; }
    if(micBlocked && micAvailable()){ mic.disabled=false; $("micHint").textContent=t().micDenied; return; }
    if(!e){ mic.disabled=true; $("micHint").textContent=t().micNo; if(exAns) $("exAns").classList.add("show"); return; }
    mic.disabled=false; $("micHint").textContent=t().micTap;
  };
  refreshCurrentMic();
  show("speak");
  setTimeout(()=>{ if($("speak").classList.contains("show") && $("spEn").textContent===en) speak(en,{voice:v}); },400);
}
function renderSpeak(s){
  let done=false;

  setupSpeakScreen({
    label: s.island ? `${t().speakIsl} (${s.i+1}/${s.n})` : t().speak,
    en: target, ko: s.item.ko, chip:null,

    onResult: said=>{
      const fb=$("spFeedback");
      if(!said){ fb.className="feedback"; fb.textContent=t().spNone; return; }

      $("heard").innerHTML=markHTML(marks);
      if(pct>=70){ fb.className="feedback good"; fb.textContent= pct>=95?t().spGreat:t().spOk(pct); sfx.right(); if(!done){ done=true; spoken++; } }
      else { fb.className="feedback"; fb.textContent=t().spLow(pct); sfx.wrong(); }

function renderAsk(){
  const q=L.ask; let done=false;
  setupSpeakScreen({
    label: t().ask, en:q.q, ko:q.qko, chip:`${t().useThis} ${q.use}`, exAns:q.ex, voice:1,
    judge: txt=>{ const w=words(txt), n=" "+w.join(" ")+" "; const m=q.must.map(x=>words(x)).find(x=>n.includes(" "+x.join(" ")+" ")); return m && w.length>m.length ? 1 : 0; },
    onResult: said=>{
      const fb=$("spFeedback");
      if(!said){ fb.className="feedback"; fb.textContent=t().spNone; return; }
      const norm=" "+words(said).join(" ")+" | "+words(heardAlts).join(" ")+" ";
      const hitPhrase=q.must.map(m=>words(m).join(" ")).find(m=>norm.includes(" "+m+" "));
      // highlight the chunk inside what they said
      let shown=esc(said);
      if(hitPhrase){ // highlight the chunk in their own words (handles I'm / gonna forms)
        const raw=q.must.map(m=>m.replace(/^i am /,"(?:i am|i'm) ").replace(/going to/,"(?:going to|gonna)")).join("|");
        try{ shown=shown.replace(new RegExp(`(${raw})`,"i"), '<span class="hit">$1</span>'); }catch(e){}
      }
      $("heard").innerHTML=shown;
      if(hitPhrase){ fb.className="feedback good"; fb.textContent=t().askOk; sfx.right(); if(!done){ done=true; spoken++; } }
      else { fb.className="feedback"; fb.textContent=t().askMiss; sfx.wrong(); }
      $("exAns").classList.add("show");
      $("spActions").style.display="flex";
    }
  });
}

    `SUMMARY:${t().icsTitle}`,`DESCRIPTION:${t().icsDesc} ${url}`,`URL:${url}`,
    "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${t().icsTitle}`,"TRIGGER:PT0M","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  try{
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
    a.download="chunk-daily-reminder.ics"; document.body.appendChild(a); a.click(); a.remove();
    toast(t().remDone); track("reminder_added",{time:S.remindAt});
  }catch(e){ toast(t().remNo); }
}
let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredInstall=e; renderInstall(); });
function isStandalone(){ try{ return matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; }catch(e){ return false; } }
function renderInstall(){
  const r=$("installRow"); if(!r) return;
  if(IN_CLAUDE || isStandalone()){ r.innerHTML=""; return; }
  if(deferredInstall){
    r.innerHTML=`<button class="btn mint" id="installBtn" style="width:100%">${t().installBtn}</button>`;
    $("installBtn").onclick=async()=>{ try{ deferredInstall.prompt(); await deferredInstall.userChoice; }catch(e){} deferredInstall=null; renderInstall(); track("app_install_prompt"); };
  } else if(/iphone|ipad|ipod/i.test(navigator.userAgent)){ r.innerHTML=`<div class="smallnote" style="text-align:left">${t().iosInstall}</div>`; }
  else r.innerHTML="";
}

/* ----- HOME (streak, next lesson, learning map) ----- */
let mapLv=null, openUnit=null;
const CHEV='<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function firstOfUnit(u){ return LESSONS.findIndex(l=>l.unit>=u); }
function jumpTo(u){
  const i=firstOfUnit(u); if(i<0) return;
  if(i>S.next){ S.next=i; save(); track("level_jump",{unit:u}); }
  openUnit=u; mapLv=UNITS[u].lv; toast(t().jumped(u));
}
function renderMap(){
  const xs=[0,56,84,56,0,-56,-84,-56];
  const boatSVG=$("boat").innerHTML;
  const nextUnit = S.next<LESSONS.length ? LESSONS[S.next].unit : LESSONS[LESSONS.length-1].unit;
  if(!mapLv) mapLv=UNITS[nextUnit].lv;
  if(openUnit===null) openUnit=nextUnit;
  const lvs=Object.keys(LEVELS);
  let html=`<div class="lvtabs">${lvs.map(lv=>{ const us=UNITS.map((u,i)=>u&&u.lv===lv?i:0).filter(Boolean);
      const tot=LESSONS.filter(l=>us.includes(l.unit)).length, d=LESSONS.filter((l,i)=>us.includes(l.unit)&&S.done[i]).length;
      return `<button data-lv="${lv}" class="${lv===mapLv?"on":""}">${lv}<small>${d}/${tot}</small></button>`; }).join("")}</div>`;
  UNITS.forEach((U,u)=>{
    if(!U || U.lv!==mapLv) return;
    const idx=LESSONS.map((l,i)=>l.unit===u?i:-1).filter(i=>i>=0);
    if(!idx.length) return;
    const d=idx.filter(i=>S.done[i]).length, locked=idx[0]>S.next, done=d===idx.length, open=openUnit===u;
    html+=`<div class="unit ${open?"open":""}" data-u="${u}"><button class="unitbanner ${done?"done":""} ${locked?"locked":""}" aria-expanded="${open}">`
      +`<span class="ut"><small>Unit ${u}</small><b>${esc(U[S.lang])}</b></span>`
      +`<span class="uprog">${locked?ICON.lock:t().uProg(d,idx.length)}</span>${CHEV}</button>`
      +(locked?`<div class="jumpbox">${t().jumpTxt}<button class="btn" data-jump="${u}">${t().jumpBtn}</button></div>`:"")
      +`<div class="stops">`;
    idx.forEach((i,k)=>{
      const l=LESSONS[i], isNext=i===S.next, dn=!!S.done[i], unlocked=i<=S.next, x=xs[k%xs.length];
      const icon = l.island ? "🏝️" : dn ? ICON.check : !unlocked ? ICON.lock : isNext ? ICON.star : lessonNumber(i);
      const name = `${l.island?t().island:t().lesson} ${lessonNumber(i)}`;
      html+=`<div class="stop ${l.island?"isl":""} ${dn?"done":""} ${isNext?"next":""} ${!unlocked?"locked":""}" data-n="${i}" style="--x:${x}px">`
        +(isNext?`<span class="startbubble">${t().popStart}</span>`:"")
        +`<button class="isle-btn" aria-label="${esc(name)}">${icon}</button>`
        +(isNext?`<span class="hereboat ${x>0?"l":"r"}">${boatSVG}</span>`:"")
        +`</div><div class="pop" id="pop${i}"></div>`;
    });
    html+=`</div></div>`;
  });
  if(mapLv===lvs[lvs.length-1]) html+=`<div class="finish">🏁 ${t().finishLine}</div>`;
  $("map").innerHTML=html;
  $("map").querySelectorAll(".lvtabs button").forEach(b=>b.onclick=()=>{ sfx.tap&&sfx.tap(); mapLv=b.dataset.lv;
    const us=UNITS.map((u,i)=>u&&u.lv===mapLv?i:0).filter(Boolean); openUnit = us.includes(nextUnit)?nextUnit:us[0]; renderMap(); });
  $("map").querySelectorAll(".unitbanner").forEach(b=>b.onclick=()=>{ const u=+b.parentNode.dataset.u;
    openUnit = openUnit===u ? -1 : u; renderMap();
    if(openUnit===u) setTimeout(()=>{ const el=$("map").querySelector(`.unit[data-u="${u}"]`); el&&el.scrollIntoView({block:"start",behavior:"smooth"}); },30); });
  $("map").querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{ jumpTo(+b.dataset.jump); renderHome(); });
  $("map").querySelectorAll(".stop").forEach(n=>n.querySelector(".isle-btn").onclick=()=>{
    const i=+n.dataset.n;
    if(n.classList.contains("locked")){ toast(t().lockedMsg); return; }
    const pop=$("pop"+i), wasOpen=pop.classList.contains("show");
    $("map").querySelectorAll(".pop.show").forEach(p=>p.classList.remove("show"));
    if(wasOpen) return;
    const l=LESSONS[i], isNext=i===S.next;
    pop.innerHTML=`<small>${l.island?t().island:t().lesson} ${lessonNumber(i)}, Unit ${l.unit}</small><b>${esc(l.topic[S.lang])}</b><button class="btn ${isNext?"":"ghost"}" style="width:100%">${isNext?t().popStart:t().popReview}</button>`;
    pop.querySelector("button").onclick=()=>{ challengeMode=null; startLesson(i, !isNext); };
    pop.classList.add("show");
    pop.scrollIntoView({block:"nearest",behavior:"smooth"});
  });
}
function renderHome(){
  const doneToday = S.lastDay===TODAY;
  $("homeHello").textContent = doneToday ? t().homeDone : t().homeHi;
  $("heroMascot").innerHTML = mascotSVG(doneToday ? "cheer" : "happy");
  const due=dueList().length, any=Object.keys(S.srs).length;
  $("reviewTitle").textContent = !any ? t().reviewName : due ? t().reviewDue(due) : t().reviewNone;
  $("reviewSub").textContent = !any ? t().reviewEmpty : due ? t().reviewSub : t().reviewNext(nextDueIn());
  $("reviewActions").style.display = due ? "" : "none"; $("reviewBtn").textContent=t().reviewBtn;
  $("reviewCard").style.display = any ? "" : "none";
  $("brandMark").innerHTML = mascotSVG("happy");
$("lessonBar").appendChild($("hearts"));
  $("remLbl").textContent=t().remLbl; $("remBtn").textContent=t().remBtn;
  $("remTime").value=S.remindAt||"20:00";
  $("remNote").textContent = IN_CLAUDE ? t().remNo : t().remNote;
  renderInstall();
  $("homeStats").innerHTML = `<span>${t().day} ${myDay()}</span><span>${t().lessonsDone(Object.keys(S.done).length, LESSONS.length)}</span>`;
  if(S.next < LESSONS.length){
    const l=LESSONS[S.next];
    $("nextLbl").textContent=`${t().upNext}: ${lessonLabel(S.next)}`; $("nextName").textContent=l.topic[S.lang];
    $("nextUnit").textContent=`Unit ${l.unit} · ${UNITS[l.unit][S.lang]}`;
    $("homeStart").style.display=""; $("homeStart").textContent=t().startLesson;
  } else {
    $("nextLbl").textContent=""; $("nextName").textContent=t().allDone; $("nextUnit").textContent="";

  $("homeMapLbl").textContent=t().mapTitle;

function goHome(){
  hideSheet(); stopAudio(); micAbort(); challengeMode=null; steps=[]; step=0;
  openUnit=null; mapLv=null;
  $("daytag").textContent=`${t().day} ${myDay()}`; $("pbadge").className="badge";
  renderHome(); show("home");
}
function askQuit(){
  $("quitTitle").textContent=t().quitTitle; $("quitText").textContent=t().quitText;
  $("quitStay").textContent=t().quitStay; $("quitLeave").textContent=t().quitLeave; $("quitMascot").innerHTML=mascotSVG("sad");
  openModal("quitModal");
}
/* Some previews stretch the page into one very tall frame; there, a centered popup can open out of view.
   In that case, open popups next to whatever was tapped. */
let lastTapY=0;
document.addEventListener("pointerdown",e=>{ lastTapY=e.pageY; },true);
function openModal(id){
  const m=$(id), sheet=m.querySelector(".sheet");
  const stretched = window.innerHeight > Math.max(screen.height||0, 900)*1.3;
  if(stretched){ m.style.position="absolute"; m.style.height=document.documentElement.scrollHeight+"px"; m.style.alignItems="flex-start";
    sheet.style.marginTop=Math.max(20, lastTapY-260)+"px"; sheet.style.maxHeight="none"; }
  else { m.style.position=""; m.style.height=""; m.style.alignItems=""; sheet.style.marginTop=""; sheet.style.maxHeight=""; }
  m.classList.add("show");
}


/* ----- help, language, speed ----- */
function renderHelp(){
  $("helpTitle").textContent=t().helpTitle;
  $("helpList").innerHTML=t().helpList.map(x=>`<li>${x}</li>`).join("");
  $("helpNote").innerHTML=t().helpNote+(POSTHOG_KEY?`<br><br><small>${t().privacy}</small>`:""); $("helpClose").textContent=t().go;
}
function toggleLang(){
  S.lang = S.lang==="ko"?"en":"ko"; save(); renderStats(); renderHelp(); socialTexts();
  if($("home").classList.contains("show")){ goHome(); return; }
  if(L) header();
  if($("result").classList.contains("show")){ showResult(lastRes.perfect, shownMarks, 0, lastRes.heard); return; }
  const s=steps[step]; if(!s) return;
  if(s.type==="build"){ // keep the learner's picks
    $("buildLabel").textContent = s.retry ? t().retryLbl : s.review ? t().review : s.audio ? t().buildAudio : `${t().build} (${s.i+1}/${s.n})`;
    if(!s.audio && S.lang==="en") $("gloss").textContent="= "+B.en; else if(!s.audio) $("gloss").textContent="";
    $("peekBtn").textContent=t().peek; $("checkBtn").textContent=t().check; $("feedback").textContent=""; renderAnswer();
  } else if(s.type==="listen"){ $("listenLabel").textContent=`${ttsOK?t().listen:t().listenNoAudio} (${lsIdx+1}/${lsRounds.length})`; }
  else runStep();
}

function renderSettings(){
  $("setTitle").textContent=t().setTitle; $("setSpeedLbl").textContent=t().setSpeed; $("setSpeedSub").textContent=t().setSpeedSub;
  $("setSpeed").textContent = S.speed==="slow"?t().slow:t().normal;
  $("setLvLbl").textContent=t().setLvLbl; $("setLvSub").textContent=t().setLvSub;
  const curLv = UNITS[LESSONS[Math.min(S.next,LESSONS.length-1)].unit].lv;
  $("setLv").innerHTML=Object.keys(LEVELS).map(lv=>`<button data-lv="${lv}" class="${lv===curLv?"on":""}">${lv}</button>`).join("");
  $("setLv").querySelectorAll("button").forEach(b=>b.onclick=()=>{ const lv=b.dataset.lv; const u=lvFirstUnit(lv);
    if(firstOfUnit(u)>S.next) jumpTo(u); else { mapLv=lv; openUnit=null; }
    renderSettings(); if($("home").classList.contains("show")) renderHome(); });
  $("setHelpLbl").textContent=t().helpTitle; $("setHelp").textContent=t().openHelp; $("setClose").textContent=t().close2;
  $("remLbl").textContent=t().remLbl; $("remBtn").textContent=t().remBtn; $("remTime").value=S.remindAt||"20:00";
  $("remNote").textContent = IN_CLAUDE ? t().remNo : t().remNote; renderInstall();
  $("bkLbl").textContent=t().bkLbl; $("bkNote").textContent=t().bkNote; $("bkSave").textContent=t().bkSave; $("bkLoad").textContent=t().bkLoad; $("bkApply").textContent=t().bkApply; $("bkCode").placeholder=t().bkPaste;
}
$("setSpeed").onclick=()=>{ S.speed = S.speed==="slow"?"normal":"slow"; save(); renderStats(); renderSettings(); };

async function sendSaveLink(){
  const link=SITE_URL.replace(/#.*$/,"")+"#restore="+bkEncode();
  $("bkCode").value=link;
  try{ if(navigator.share && !IN_CLAUDE){ await navigator.share({title:"Chunk Daily", text:t().bkLbl, url:link}); return; } }catch(e){ if(e && e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(link); toast(t().bkCopied); }catch(e){ const ta=document.createElement("textarea"); ta.value=link; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(_){} ta.remove(); toast(t().bkCopied); }
  track("save_link");
}

/* first visit: what the app teaches, in 3 short screens */
let wIdx=0;
function renderWelcome(){
  const T0=t(), s=T0.w[wIdx], last=wIdx===T0.w.length-1;
  let mid="";
  if(wIdx===1) mid=`<div class="wlevels">${T0.wLevels.map(([lv,d],i)=>`<div><span style="background:${["#11A99B","#2F80ED","#FF7A1A"][i]}">${lv}</span>${d}</div>`).join("")}</div>`;
  if(wIdx===3) mid=`<div class="wlevels pick">${T0.wPick.map(([lv,a,b],i)=>`<div data-lv="${lv}" class="${(wPickLv||"A1")===lv?"on":""}"><span style="background:${["#11A99B","#2F80ED","#FF7A1A"][i]}">${lv}</span><span style="flex:1;color:#14213D;background:none;padding:0;text-align:left;font-size:15px">${a}<em>${b}</em></span></div>`).join("")}</div>`;
  if(wIdx===2) mid=`<div class="wsteps">${T0.wSteps.map(([a,b],i)=>`<div><i>${i+1}</i><span><b>${a}</b>${b}</span></div>`).join("")}</div>`;
  $("wSlide").innerHTML = (wIdx===0?`<div class="wart">${mascotSVG("happy")}</div>`:"") + `<h2>${s.t}</h2>` + mid + `<p>${s.p}</p>`;
  $("wDots").innerHTML=T0.w.map((_,i)=>`<i class="${i===wIdx?"on":""}"></i>`).join("");
  $("wNext").textContent = last ? T0.wGo : T0.wNext;
  $("wSkip").textContent = T0.wSkip; $("wSkip").style.visibility = last ? "hidden" : "visible";
  $("wSlide").querySelectorAll(".wlevels.pick div").forEach(d=>d.onclick=()=>{ ac(); wPickLv=d.dataset.lv; renderWelcome(); });
}
let wPickLv=null;
function lvFirstUnit(lv){ return UNITS.findIndex(u=>u&&u.lv===lv); }

function closeWelcome(){ ac(); $("welcome").classList.remove("show"); S.seenHelp=true; save(); track("welcome_done",{at:wIdx, lv:wPickLv||"A1"});
  if(wPickLv && wPickLv!=="A1"){ jumpTo(lvFirstUnit(wPickLv)); } if($("home").classList.contains("show")) renderHome(); }

/* every popup: ✕ in the corner, tap outside, or Escape closes it (same as its own close button) */
const MODAL_CLOSE={welcome:"wSkip", help:"helpClose", settings:"setClose", quitModal:"quitStay", hintModal:"hintClose", storyModal:"storyClose", challengeModal:"chClose", vsModal:"vsLater"};
Object.entries(MODAL_CLOSE).forEach(([id,btn])=>{
  const m=$(id), x=document.createElement("button");
  x.className="xclose"; x.setAttribute("aria-label","close"); x.textContent="✕";
  x.onclick=()=>$(btn).click();
  m.querySelector(".sheet").prepend(x);
  m.addEventListener("click",e=>{ if(e.target===m) $(btn).click(); });
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  const open=Object.keys(MODAL_CLOSE).filter(id=>$(id).classList.contains("show")).pop();
  if(open) $(MODAL_CLOSE[open]).click();
});

else if(!S.seenHelp) openWelcome();
