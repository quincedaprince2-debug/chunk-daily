<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Chunk Daily — 오늘의 영어 퍼즐</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F3F8FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chunk Daily">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ============ Chunk Daily — "sea chart" design system ============
     Ink  #14213D  text, structure        Foam  #F3F8FA  app background
     Lagoon #11A99B  go / correct          Buoy  #FF7A1A  rewards, streak, current spot
     Sand #F2DFB8  islands                 Reef  #E5484D  errors only                 */
  :root{
    --ink:#14213D; --ink2:#46536B; --muted:#7A8699; --line:#DCE5EA; --line2:#C9D5DC;
    --bg:#F3F8FA; --card:#FFFFFF;
    --lagoon:#11A99B; --lagoon-d:#0B8579; --lagoon-t:#DDF5F1;
    --buoy:#FF7A1A; --buoy-d:#D9600A; --buoy-t:#FFEBDC;
    --sand:#F2DFB8; --sand-d:#D9BE86;
    --reef:#E5484D; --reef-d:#B8333A; --reef-t:#FDE7E8;
    --sky:#2F80ED; --sky-d:#1F64C4;
    /* old names kept so nothing breaks */
    --coral:var(--lagoon); --coral-d:var(--lagoon-d); --mint:var(--lagoon); --mint-d:var(--lagoon-d);
    --sun:var(--buoy); --red:var(--reef); --sea:var(--sky); --sea-d:var(--sky-d);
    --display:'Do Hyeon','Noto Sans KR',sans-serif;
    --text:'Nunito','Noto Sans KR',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
  h2,.big,.hellotitle,.islandtitle,.fbtitle{text-wrap:balance}
  #daytag{display:none}
  .wordmark{white-space:nowrap}
  .brand{min-width:0}
  .say,.bigplay,.mic,.minimic{display:flex;align-items:center;justify-content:center;padding:0}
  .say svg{width:21px;height:21px} .say.sm svg{width:17px;height:17px}
  .bigplay svg{width:44%;height:44%}
  .mic svg{width:42px;height:42px} .minimic svg{width:22px;height:22px}
  .speed svg{width:15px;height:15px;vertical-align:-3px;margin-right:4px}
  .btn.ghost svg{width:22px;height:22px;display:block;margin:0 auto}
  .hearts{display:flex;gap:4px}
  .hrt{color:#D5DDE3;display:flex} .hrt.on{color:var(--reef)} .hrt svg{width:24px;height:24px}
  button{font-family:inherit}
  :focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:12px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .wrap{max-width:460px;margin:0 auto;padding:12px 18px 40px;min-height:100vh}

  /* ---------- app bar (home + results) ---------- */
  header.appbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 10px}
  .brand{display:flex;align-items:center;gap:8px}
  .brandmark{width:34px;height:28px;display:block}
  .wordmark{font-family:var(--display);font-size:23px;letter-spacing:-.3px;color:var(--ink)}
  .stats{display:flex;gap:4px;align-items:center;flex:0 0 auto}
  .stat{display:flex;align-items:center;gap:3px;font-weight:900;font-size:16px;padding:4px 4px;border-radius:10px;white-space:nowrap}
  .stat svg{width:22px;height:22px}
  .stat.streak{color:var(--buoy)}
  .stat.xp{color:var(--sky)}
  .stat.dim{color:#AAB5C3}
  .iconbtn{display:flex;align-items:center;justify-content:center;background:transparent;border:2px solid var(--line);border-radius:12px;min-width:36px;height:36px;padding:0 8px;font-weight:900;font-size:13px;cursor:pointer;color:var(--ink2)}
  .iconbtn svg{width:20px;height:20px}
  .pill.bump{animation:pillpop .7s ease-out}
  @keyframes pillpop{35%{transform:scale(1.5)}100%{transform:scale(1)}}

  /* ---------- lesson bar (focus mode) ---------- */
  .lessonbar{display:none;align-items:center;gap:10px;padding:2px 0 6px}
  .lessonbar.show{display:flex}
  .quit{background:none;border:none;cursor:pointer;color:#9AA6B6;padding:4px;display:flex}
  .quit svg{width:24px;height:24px}
  .track{position:relative;flex:1;height:44px;border-radius:14px;background:linear-gradient(#E3F4F8,#BFE6EF);overflow:hidden}
  .wave{position:absolute;left:-20px;right:-20px;bottom:0;height:10px;background:radial-gradient(circle at 8px -2px,transparent 8px,#8FD3E3 9px) 0 0/16px 10px;animation:drift 2.5s linear infinite}
  @keyframes drift{to{transform:translateX(16px)}}
  .isle{position:absolute;right:4px;bottom:2px;font-size:28px;line-height:1}
  .boat{position:absolute;bottom:4px;left:calc((100% - 78px) * var(--p,0) + 2px);width:42px;height:35px;transition:left .9s cubic-bezier(.3,1.35,.5,1);animation:bob 2.2s ease-in-out infinite;transform-origin:50% 80%}
  .boat svg{width:100%;height:100%;display:block}
  @keyframes bob{50%{transform:translateY(-2px) rotate(-2deg)}}
  .boat.dash{animation:dash .55s ease-out}
  @keyframes dash{35%{transform:translateY(-7px) rotate(7deg)}}
  .boat.rock{animation:rock .7s ease-in-out}
  @keyframes rock{20%{transform:rotate(-16deg)}50%{transform:rotate(13deg)}80%{transform:rotate(-6deg)}}
  .boat.cheer{animation:cheer .5s ease-in-out 4}
  @keyframes cheer{50%{transform:translateY(-10px)}}
  .splash{position:absolute;bottom:18px;font-size:16px;pointer-events:none;animation:splash .9s ease-out forwards}
  @keyframes splash{to{transform:translateY(-20px) scale(1.3);opacity:0}}
  .speed{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 9px;font-weight:800;font-size:12px;cursor:pointer;color:var(--ink2);white-space:nowrap}
  .toprow{display:none;margin:4px 0 0}
  .toprow.show{display:block}
  .topleft{display:flex;align-items:center}
  .daytag{font-weight:800;color:var(--muted);font-size:13px}
  .badge{display:none;background:var(--buoy-t);color:var(--buoy-d);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;margin-left:8px}
  .badge.show{display:inline-block}
  .badge.isl{background:#E2EEFF;color:var(--sky-d)}

  /* ---------- stages + surfaces ---------- */
  .stage{display:none}
  .stage.show{display:block;animation:enter .25s ease-out}
  @keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{background:transparent;padding:14px 0 0}
  .label{font-size:14px;color:var(--muted);font-weight:800}
  .smallnote{color:var(--muted);font-size:13px;font-weight:700;margin-top:8px;line-height:1.5}

  /* ---------- buttons: one primary color, one secondary style ---------- */
  .btn{flex:1;font-weight:900;font-size:17px;border:none;border-radius:16px;padding:15px;cursor:pointer;color:#fff;background:var(--lagoon);box-shadow:0 4px 0 var(--lagoon-d);transition:transform .06s,box-shadow .06s;letter-spacing:.2px}
  .btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--lagoon-d)}
  .btn:disabled{background:#E4EAEE;color:#A6B1BF;box-shadow:0 4px 0 #CDD6DD;cursor:default}
  .btn:disabled:active{transform:none}
  .btn.ghost,.btn.ink{background:var(--card);color:var(--ink2);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
  .btn.ghost{flex:0 0 auto;padding:13px 16px}
  .btn.mint{background:var(--lagoon);box-shadow:0 4px 0 var(--lagoon-d)}
  .btn.sea{background:var(--sky);box-shadow:0 4px 0 var(--sky-d)}
  .btn.gold{background:var(--buoy);box-shadow:0 4px 0 var(--buoy-d)}
  .hintbtn{font-size:19px;padding:13px 15px}
  .hintbtn.locked{opacity:.4}
  .actions{margin-top:18px;display:flex;gap:10px}
  #build .actions{position:sticky;bottom:12px;z-index:3;background:linear-gradient(transparent,var(--bg) 30%);padding-top:16px}
  .skip{display:block;margin:14px auto 0;background:none;border:none;color:var(--muted);font-weight:800;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .linkbtn{display:block;margin:12px auto 0;background:none;border:none;color:var(--ink2);font-weight:900;font-size:15px;cursor:pointer;padding:8px}

  .say{border:none;background:var(--sky);color:#fff;border-radius:50%;width:42px;height:42px;font-size:17px;cursor:pointer;box-shadow:0 3px 0 var(--sky-d);flex:0 0 auto}
  .say:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sky-d)}
  .say.sm{width:34px;height:34px;font-size:14px}

  /* ---------- learn ---------- */
  .topic{font-weight:800;font-size:14px;color:var(--lagoon-d);margin-top:2px}
  .chunkbig{font-family:var(--text);font-weight:900;font-size:32px;line-height:1.15;margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;letter-spacing:-.4px}
  .meaning{margin-top:10px;font-weight:800;font-size:21px;line-height:1.4}
  .use{margin-top:4px;color:var(--muted);font-weight:700;font-size:14px}
  .example{margin-top:18px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
  .example .exen{font-weight:900;font-size:18px;display:flex;align-items:center;gap:8px;justify-content:space-between}
  .example .exko{margin-top:4px;color:var(--muted);font-size:15px}
  .example mark{background:var(--buoy-t);color:var(--buoy-d);border-radius:6px;padding:0 4px}
  .repeat{margin-top:12px;display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px 14px;background:var(--lagoon-t)}
  .minimic{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:none;background:var(--lagoon);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 3px 0 var(--lagoon-d)}
  .minimic.live{background:var(--reef);box-shadow:0 3px 0 var(--reef-d);animation:pulse 1.2s infinite}
  .minimic.done{background:var(--lagoon-d)}
  .repeat .rtxt{flex:1;font-weight:800;font-size:15px;line-height:1.4}
  .repeat .rtxt small{display:block;color:var(--ink2);opacity:.75;font-weight:700;font-size:13px;margin-top:2px}

  /* ---------- island intro ---------- */
  .islandhero{text-align:center;font-size:44px;line-height:1;margin-top:6px}
  .islandtitle{font-family:var(--display);font-size:26px;text-align:center;margin-top:8px}
  .islanddesc{text-align:center;color:var(--muted);font-weight:700;font-size:15px;margin-top:6px;line-height:1.5}
  .dialog{margin-top:16px;display:flex;flex-direction:column;gap:8px}
  .bub{max-width:84%;padding:10px 14px;border-radius:18px;font-weight:800;font-size:15px;line-height:1.4;transition:transform .2s;cursor:pointer}
  .bub small{display:block;font-weight:600;color:var(--muted);font-size:12.5px;margin-top:2px}
  .bub .who{font-size:12px;font-weight:800;opacity:.6;display:block;margin-bottom:2px}
  .bub.you{align-self:flex-end;background:var(--lagoon-t);border-bottom-right-radius:6px}
  .bub.them{align-self:flex-start;background:var(--card);border:2px solid var(--line);border-bottom-left-radius:6px}
  .bub.on{transform:scale(1.03);box-shadow:0 0 0 3px var(--buoy)}
  .playall{display:block;margin:16px auto 0;border:none;background:var(--sky);color:#fff;font-weight:900;font-size:15px;border-radius:999px;padding:11px 20px;cursor:pointer;box-shadow:0 4px 0 var(--sky-d)}
  .recap{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
  .recap span{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:5px 10px;font-weight:800;font-size:13px}

  /* ---------- listen ---------- */
  .bigplay{display:block;margin:20px auto 6px;width:96px;height:96px;border-radius:28px;border:none;background:var(--sky);color:#fff;font-size:38px;cursor:pointer;box-shadow:0 6px 0 var(--sky-d)}
  .bigplay:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sky-d)}
  .bigplay.playing{animation:pulseb 1s infinite}
  @keyframes pulseb{0%{box-shadow:0 0 0 0 rgba(47,128,237,.45),0 6px 0 var(--sky-d)}70%{box-shadow:0 0 0 18px rgba(47,128,237,0),0 6px 0 var(--sky-d)}100%{box-shadow:0 0 0 0 rgba(47,128,237,0),0 6px 0 var(--sky-d)}}
  .qtext{text-align:center;font-weight:800;font-size:22px;margin:16px 0 4px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
  .opt{font-weight:800;font-size:16px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:16px 8px;cursor:pointer}
  .opt:active{transform:translateY(2px);border-bottom-width:2px}
  .opt.right{background:var(--lagoon-t);border-color:var(--lagoon);color:var(--lagoon-d)}
  .opt.wrong{background:var(--reef-t);border-color:var(--reef);color:var(--reef-d);animation:shake .4s}

  /* ---------- build: clean white tiles on ruled lines ---------- */
  .ko{font-weight:800;font-size:23px;line-height:1.4;margin-top:10px}
  .gloss{color:var(--muted);font-size:14px;font-weight:700;margin-top:2px}
  .audiobox{display:flex;align-items:center;gap:14px;margin-top:12px}
  .audiobox .bigplay{margin:0;width:76px;height:76px;font-size:30px;border-radius:24px}
  .audiobox .peek{background:none;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;cursor:pointer;color:var(--ink2)}
  .hearts{margin-top:10px;font-size:16px;letter-spacing:2px}
  .answer{min-height:118px;margin-top:16px;padding:3px 0 8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;
    background:repeating-linear-gradient(transparent 0 56px,var(--line2) 56px 58px);transition:background-color .2s;border-radius:6px}
  .answer .ph{color:#AEB9C6;font-size:14px;font-weight:700;padding:12px 2px}
  .answer.wrong{animation:shake .4s}
  .answer.right .chunk{border-color:var(--lagoon);color:var(--lagoon-d);background:var(--lagoon-t)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;justify-content:center}
  .chunk{font-weight:800;font-size:17px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px 14px;cursor:pointer;transition:transform .06s,opacity .15s}
  .chunk:active{transform:translateY(2px);border-bottom-width:2px}
  .chunk.used{background:#E8EEF2;color:transparent;border-color:#E8EEF2;pointer-events:none}
  .answer .chunk{animation:snap .2s ease-out}
  @keyframes snap{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
  .reveal .chunk{border-color:var(--lagoon)!important;color:var(--lagoon-d)!important;background:var(--lagoon-t)!important}
  .feedback{min-height:22px;text-align:center;font-weight:800;margin-top:12px;color:var(--reef)}
  .feedback.good{color:var(--lagoon-d)}

  /* ---------- speak + ask ---------- */
  .target{font-weight:900;font-size:22px;margin-top:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;line-height:1.35}
  .targetko{color:var(--muted);font-size:15px;margin-top:4px}
  .usechip{margin-top:12px;display:inline-block;background:var(--buoy-t);color:var(--buoy-d);border-radius:12px;padding:7px 11px;font-weight:800;font-size:14px}
  .micwrap{display:flex;flex-direction:column;align-items:center;margin-top:24px}
  .mic{width:96px;height:96px;border-radius:50%;border:none;background:var(--lagoon);color:#fff;font-size:38px;cursor:pointer;box-shadow:0 6px 0 var(--lagoon-d)}
  .mic:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lagoon-d)}
  .mic:disabled{background:#E4EAEE;box-shadow:0 6px 0 #CDD6DD}
  .mic.live{background:var(--reef);box-shadow:0 6px 0 var(--reef-d);animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.45)}70%{box-shadow:0 0 0 22px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
  .michint{margin-top:12px;font-weight:800;color:var(--muted);font-size:14px;text-align:center}
  .heard{margin-top:16px;min-height:48px;border-radius:16px;background:var(--card);border:2px solid var(--line);padding:12px;font-size:17px;font-weight:700;line-height:1.6}
  .heard:empty{display:none}
  .heard .w{display:inline-block;border-radius:6px;padding:0 5px;margin:2px}
  .heard .ok{background:var(--lagoon-t);color:var(--lagoon-d)}
  .heard .miss{background:var(--reef-t);color:var(--reef-d);text-decoration:line-through}
  .heard .hit{background:var(--buoy-t);color:var(--buoy-d);border-radius:6px;padding:0 4px}
  .exans{margin-top:12px;background:var(--lagoon-t);border-radius:16px;padding:12px 14px;display:none;align-items:center;gap:10px;justify-content:space-between;font-weight:800}
  .exans.show{display:flex}
  .exans small{display:block;color:var(--lagoon-d);font-weight:800;font-size:12px}

  /* ---------- results ---------- */
  #result .card{text-align:center}
  .resmascot{width:110px;height:88px;margin:4px auto 0}
  .big{font-family:var(--display);font-size:34px;text-align:center;margin-top:6px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
  .tile{border-radius:16px;border:2px solid;overflow:hidden;text-align:center;background:var(--card)}
  .tile small{display:block;color:#fff;font-weight:900;font-size:12px;padding:5px 0}
  .tile b{display:block;font-weight:900;font-size:22px;padding:10px 0 12px}
  .tile.t-xp{border-color:var(--buoy)} .tile.t-xp small{background:var(--buoy)} .tile.t-xp b{color:var(--buoy-d)}
  .tile.t-acc{border-color:var(--lagoon)} .tile.t-acc small{background:var(--lagoon)} .tile.t-acc b{color:var(--lagoon-d)}
  .tile.t-talk{border-color:var(--sky)} .tile.t-talk small{background:var(--sky)} .tile.t-talk b{color:var(--sky-d)}
  .xpgain,.statsrow{display:none}
  .review{margin-top:20px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:6px 16px}
  .review .label{padding-top:10px}
  .review .row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:2px solid #EEF3F6}
  .review .row:last-child{border-bottom:none}
  .review .row b{font-size:16px}
  .review .row span{color:var(--muted);font-size:13px;text-align:right}
  .tip{margin-top:12px;text-align:left;background:var(--buoy-t);border-radius:16px;padding:14px;font-size:15px;line-height:1.6}
  .sharebox{margin-top:16px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;text-align:center}
  #shareTitle{font-family:var(--display);font-size:19px}
  .sharebox .sq{font-size:22px;letter-spacing:3px;margin:6px 0}
  .sharebox small{color:var(--muted);font-weight:700}
  .sharebtns{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .countdown{text-align:center;margin-top:14px;color:var(--muted);font-weight:800;font-size:14px}
  .countdown b{color:var(--ink);font-size:17px}

  /* ---------- home: greeting, review, sea chart ---------- */
  .hello{display:flex;align-items:center;gap:14px;padding:8px 0 4px}
  .heromascot{width:78px;height:64px;flex:0 0 auto}
  .hellotitle{font-family:var(--display);font-size:25px;line-height:1.2}
  .homestats{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-weight:800;font-size:13px}
  .reviewbar{display:flex;align-items:center;gap:12px;margin-top:14px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 12px 12px 14px}
  .reviewbar .rvicon{font-size:26px}
  .reviewbar .rvtext{flex:1;min-width:0}
  .reviewbar b{display:block;font-size:16px}
  .reviewbar small{display:block;color:var(--muted);font-weight:700;font-size:12.5px;margin-top:1px}
  .reviewbar .btn{flex:0 0 auto;padding:10px 14px;font-size:14px;border-radius:12px}
  .chart{margin:18px -18px 0;padding:6px 18px 150px;
    background:
      radial-gradient(circle at 20% 10%,rgba(255,255,255,.55) 0 2px,transparent 3px) 0 0/46px 46px,
      linear-gradient(#E6F4F8,#D5EDF4 40%,#CBE7F0);}
  .lvdivider{display:flex;align-items:center;gap:10px;margin:22px 0 4px;color:var(--ink2);font-weight:900;font-size:13px}
  .lvdivider::before,.lvdivider::after{content:"";flex:1;height:2px;background:rgba(20,33,61,.12);border-radius:2px}
  .lvdivider.soon{color:#97A5B5}

  /* ---------- settings ---------- */

  { id:"u25-start", unit:25, topic:{"ko": "이야기 시작하기", "en": "Starting a story"}, chunks:[{"en": "You won't believe what happened.", "ko": "무슨 일이 있었는지 못 믿을 거야.", "use": {"ko": "재밌는 이야기를 꺼낼 때", "en": "Starting an interesting story"}, "ex": "Guess what! You won't believe what happened.", "hl": "You won't believe what happened.", "exko": "있잖아! 무슨 일이 있었는지 못 믿을 거야."}, {"en": "So, ___.", "ko": "그래서 말이야, ~", "use": {"ko": "이야기를 이어갈 때", "en": "Moving a story along"}, "ex": "So, I was on the subway...", "hl": "So,", "exko": "그래서 말이야, 내가 지하철에 있었는데..."}], builds:[{"ko": "무슨 일이 있었는지 못 믿을 거야.", "en": "You won't believe what happened.", "answer": ["You won't believe", "what", "happened."], "decoys": ["You will not", "happen"]}, {"ko": "있잖아! 나 오늘 연예인 봤어.", "en": "Guess what! I saw a celebrity today.", "answer": ["Guess what!", "I saw a celebrity", "today."], "decoys": ["Guessing", "I see"]}], ask:{"q": "Start telling a story about something funny that happened.", "qko": "있었던 재밌는 일을 이야기하기 시작해 보세요.", "must": ["believe", "guess what", "so"], "use": "You won't believe what happened.", "ex": "Guess what! You won't believe what happened today."}, tip:{"ko": "<b>Guess what!</b>은 \"있잖아!\" 같은 느낌이에요. 친구에게 딱!", "en": "<b>Guess what!</b> is like \"Listen to this!\" Perfect with friends."} },
  { id:"u25-was", unit:25, topic:{"ko": "그때 하고 있었어요", "en": "What was happening"}, chunks:[{"en": "I was ___ when ___.", "ko": "~하고 있었는데 ~했어요.", "use": {"ko": "이야기 배경을 말할 때", "en": "Setting the scene"}, "ex": "I was walking home when it started to rain.", "hl": "when", "exko": "집에 걸어가고 있었는데 비가 오기 시작했어요."}, {"en": "All of a sudden, ___.", "ko": "갑자기 ~했어요.", "use": {"ko": "갑작스러운 일", "en": "Something sudden"}, "ex": "All of a sudden, the lights went out.", "hl": "All of a sudden", "exko": "갑자기 불이 꺼졌어요."}], builds:[{"ko": "요리하고 있었는데 전화가 울렸어요.", "en": "I was cooking when my phone rang.", "answer": ["I was cooking", "when", "my phone rang."], "decoys": ["I cooked", "while"]}, {"ko": "갑자기 고양이가 뛰어나왔어요.", "en": "All of a sudden, a cat jumped out.", "answer": ["All of a sudden,", "a cat", "jumped out."], "decoys": ["Suddenly of", "jump out"]}], ask:{"q": "Tell me about a surprising moment.", "qko": "깜짝 놀랐던 순간을 말해 주세요.", "must": ["i was", "all of a sudden", "suddenly"], "use": "I was ___ when ___.", "ex": "I was sleeping when all of a sudden, my alarm went off."}, tip:{"ko": "길게 하던 일은 <b>was ~ing</b>, 갑자기 생긴 일은 <b>과거형</b>!", "en": "Longer background action → <b>was ~ing</b>. Sudden event → <b>past tense</b>!"} },
  { id:"u25-then", unit:25, topic:{"ko": "순서대로", "en": "In order"}, chunks:[{"en": "At first, ___.", "ko": "처음에는 ~", "use": {"ko": "이야기의 시작", "en": "The start of the story"}, "ex": "At first, I was really nervous.", "hl": "At first", "exko": "처음에는 정말 떨렸어요."}, {"en": "In the end, ___.", "ko": "결국 ~", "use": {"ko": "이야기의 끝", "en": "The end of the story"}, "ex": "In the end, everything was fine.", "hl": "In the end", "exko": "결국 다 괜찮았어요."}], builds:[{"ko": "처음에는 길을 잃었어요.", "en": "At first, I got lost.", "answer": ["At first,", "I got", "lost."], "decoys": ["First of", "I lost"]}, {"ko": "결국 우리는 제시간에 도착했어요.", "en": "In the end, we arrived on time.", "answer": ["In the end,", "we arrived", "on time."], "decoys": ["At the end", "in time"]}], ask:{"q": "Tell a short story with \"At first\" and \"In the end.\"", "qko": "\"At first\"와 \"In the end\"를 써서 짧은 이야기를 해 보세요.", "must": ["at first", "in the end"], "use": "At first, ___. In the end, ___.", "ex": "At first, I hated kimchi. In the end, I loved it."}, tip:{"ko": "<b>finally</b>는 \"드디어\", <b>in the end</b>는 \"결국\"이에요.", "en": "<b>finally</b> = at last (after waiting). <b>in the end</b> = how it turned out."} },

  { id:"u25-funny", unit:25, topic:{"ko": "웃긴 일", "en": "A funny moment"}, chunks:[{"en": "The funny thing is, ___.", "ko": "웃긴 건, ~", "use": {"ko": "이야기의 반전", "en": "The funny twist"}, "ex": "The funny thing is, he didn't even notice.", "hl": "The funny thing is", "exko": "웃긴 건, 걔는 눈치도 못 챘어."}, {"en": "I couldn't stop laughing.", "ko": "웃음이 멈추질 않았어요.", "use": {"ko": "너무 웃겼을 때", "en": "When something was hilarious"}, "ex": "It was so funny. I couldn't stop laughing.", "hl": "I couldn't stop laughing.", "exko": "너무 웃겼어요. 웃음이 멈추질 않았어요."}], builds:[{"ko": "웃긴 건, 그게 내 생일이었어.", "en": "The funny thing is, it was my birthday.", "answer": ["The funny thing is,", "it was", "my birthday."], "decoys": ["The fun thing", "it is"]}, {"ko": "웃음이 멈추질 않았어.", "en": "I couldn't stop laughing.", "answer": ["I couldn't", "stop", "laughing."], "decoys": ["I can't", "stop to laugh"]}], ask:{"q": "Tell me about something funny that happened.", "qko": "있었던 웃긴 일을 말해 주세요.", "must": ["funny", "laughing", "laugh"], "use": "The funny thing is, ___.", "ex": "I fell asleep on the bus. The funny thing is, I missed my stop twice."}, tip:{"ko": "<b>stop ~ing</b> = 하던 걸 멈추다. I couldn't stop laughing!", "en": "<b>stop ~ing</b> = quit doing something. I couldn't stop laughing!"} },
  { id:"u25-island", unit:25, island:true, uses:["u25-start", "u25-was", "u25-then"], topic:{"ko": "친구에게 썰 풀기", "en": "Telling a friend a story"}, desc:{"ko": "먼저 대화를 들어 보세요 🎧<br>그다음 직접 만들어요!", "en": "Listen to the conversation first 🎧<br>Then build it yourself!"}, dialog:[{"who": "you", "en": "You won't believe what happened.", "ko": "무슨 일이 있었는지 못 믿을 거야."}, {"who": "friend", "en": "What? Tell me!", "ko": "뭔데? 말해 봐!"}, {"who": "you", "en": "I was waiting for the bus when it started to rain.", "ko": "버스 기다리고 있었는데 비가 오기 시작했어."}, {"who": "friend", "en": "Oh no!", "ko": "헐!"}, {"who": "you", "en": "At first, I was so upset.", "ko": "처음엔 너무 짜증 났어."}, {"who": "you", "en": "In the end, a stranger shared her umbrella.", "ko": "결국 모르는 사람이 우산을 같이 씌워 줬어."}], builds:[{"ko": "무슨 일이 있었는지 못 믿을 거야.", "en": "You won't believe what happened.", "answer": ["You won't believe", "what", "happened."], "decoys": ["happen"]}, {"ko": "버스 기다리고 있었는데 비가 오기 시작했어.", "en": "I was waiting for the bus when it started to rain.", "answer": ["I was waiting for the bus", "when", "it started to rain."], "decoys": ["while"]}, {"ko": "결국 모르는 사람이 우산을 같이 씌워 줬어.", "en": "In the end, a stranger shared her umbrella.", "answer": ["In the end,", "a stranger shared", "her umbrella."], "decoys": ["At the end"]}], tip:{"ko": "🏝️ B1 첫 섬! 이제 영어로 이야기를 들려줄 수 있어요.", "en": "🏝️ First B1 island! You can now tell stories in English."} },
  { id:"u26-think", unit:26, topic:{"ko": "내 생각 말하기", "en": "Giving your opinion"}, chunks:[{"en": "I think ___.", "ko": "제 생각엔 ~", "use": {"ko": "의견을 말할 때", "en": "Sharing an opinion"}, "ex": "I think it's a great idea.", "hl": "I think", "exko": "제 생각엔 정말 좋은 아이디어예요."}, {"en": "In my opinion, ___.", "ko": "제 의견으로는 ~", "use": {"ko": "조금 더 진지하게", "en": "A more serious way to give an opinion"}, "ex": "In my opinion, the movie was too long.", "hl": "In my opinion", "exko": "제 의견으로는 영화가 너무 길었어요."}], builds:[{"ko": "제 생각엔 그게 맞아요.", "en": "I think you're right.", "answer": ["I think", "you're", "right."], "decoys": ["I'm thinking", "you"]}, {"ko": "제 의견으로는 서울은 너무 붐벼요.", "en": "In my opinion, Seoul is too crowded.", "answer": ["In my opinion,", "Seoul is", "too crowded."], "decoys": ["My opinion is", "very crowd"]}], ask:{"q": "What do you think about online classes?", "qko": "온라인 수업에 대해 어떻게 생각해요?", "must": ["i think", "in my opinion"], "use": "I think ___.", "ex": "I think online classes are convenient."}, tip:{"ko": "❌ I think so that...<br>✅ <b>I think</b> it's good. (think 뒤에 바로 문장!)", "en": "❌ I think so that...<br>✅ <b>I think</b> it's good. (sentence right after \"think\")"} },
  { id:"u26-ask", unit:26, topic:{"ko": "의견 묻기", "en": "Asking for opinions"}, chunks:[{"en": "What do you think about ___?", "ko": "~에 대해 어떻게 생각해요?", "use": {"ko": "의견을 물어볼 때", "en": "Asking someone's view"}, "ex": "What do you think about my new haircut?", "hl": "What do you think about", "exko": "제 새 머리 어때요?"}, {"en": "How do you feel about ___?", "ko": "~에 대해 어떻게 느껴요?", "use": {"ko": "감정이 섞인 의견을 물을 때", "en": "Asking how someone feels about something"}, "ex": "How do you feel about working from home?", "hl": "How do you feel about", "exko": "재택근무에 대해 어떻게 생각해요?"}], builds:[{"ko": "이 계획에 대해 어떻게 생각해요?", "en": "What do you think about this plan?", "answer": ["What do you think", "about", "this plan?"], "decoys": ["How do you think", "for"]}, {"ko": "이사하는 거 어떻게 생각해요?", "en": "How do you feel about moving?", "answer": ["How do you feel", "about", "moving?"], "decoys": ["How you feel", "to move"]}], ask:{"q": "Ask your friend's opinion about something.", "qko": "친구에게 어떤 것에 대한 의견을 물어보세요.", "must": ["what do you think", "how do you feel"], "use": "What do you think about ___?", "ex": "What do you think about this restaurant?"}, tip:{"ko": "❌ How do you think about...?<br>✅ <b>What</b> do you think about...?", "en": "❌ How do you think about...?<br>✅ <b>What</b> do you think about...?"} },
  { id:"u26-because", unit:26, topic:{"ko": "이유 들기", "en": "Giving reasons"}, chunks:[{"en": "That's because ___.", "ko": "그건 ~ 때문이에요.", "use": {"ko": "이유를 덧붙일 때", "en": "Adding a reason"}, "ex": "That's because it's cheaper.", "hl": "That's because", "exko": "그건 더 싸기 때문이에요."}, {"en": "For example, ___.", "ko": "예를 들면 ~", "use": {"ko": "예시를 들 때", "en": "Giving an example"}, "ex": "For example, I walk to work.", "hl": "For example", "exko": "예를 들면, 저는 걸어서 출근해요."}], builds:[{"ko": "그건 더 빠르기 때문이에요.", "en": "That's because it's faster.", "answer": ["That's because", "it's", "faster."], "decoys": ["It's because of", "fast"]}, {"ko": "예를 들면, 저는 매일 아침 요가를 해요.", "en": "For example, I do yoga every morning.", "answer": ["For example,", "I do yoga", "every morning."], "decoys": ["For examples", "I doing"]}], ask:{"q": "Why do you like your city? Give a reason and an example.", "qko": "왜 내가 사는 도시가 좋아요? 이유와 예시를 들어 보세요.", "must": ["because", "for example"], "use": "I like it because ___. For example, ___.", "ex": "I like Busan because of the sea. For example, I can swim in summer."}, tip:{"ko": "<b>because</b> 뒤엔 문장, <b>because of</b> 뒤엔 명사! because it's cold / because of the cold", "en": "<b>because</b> + sentence, <b>because of</b> + noun: because it's cold / because of the cold"} },
  { id:"u26-soft", unit:26, topic:{"ko": "부드럽게 말하기", "en": "Softening your opinion"}, chunks:[{"en": "I'm not sure, but ___.", "ko": "잘 모르겠지만 ~", "use": {"ko": "확신이 없을 때", "en": "When you aren't certain"}, "ex": "I'm not sure, but I think it's closed today.", "hl": "I'm not sure, but", "exko": "잘 모르겠지만, 오늘 문 닫은 것 같아요."}, {"en": "It depends on ___.", "ko": "~에 따라 달라요.", "use": {"ko": "상황에 따라 다를 때", "en": "When the answer changes"}, "ex": "It depends on the weather.", "hl": "It depends on", "exko": "날씨에 따라 달라요."}], builds:[{"ko": "잘 모르겠지만, 그게 맞는 것 같아요.", "en": "I'm not sure, but I think it's right.", "answer": ["I'm not sure,", "but I think", "it's right."], "decoys": ["I don't sure", "but think"]}, {"ko": "가격에 따라 달라요.", "en": "It depends on the price.", "answer": ["It depends", "on", "the price."], "decoys": ["It's depend", "to"]}], ask:{"q": "Is it better to live in the city or the countryside?", "qko": "도시에 사는 게 나아요, 시골에 사는 게 나아요?", "must": ["depends", "not sure", "i think"], "use": "It depends on ___.", "ex": "It depends on your job, but I prefer the city."}, tip:{"ko": "한국어 \"케바케\"는 영어로 <b>It depends.</b>예요!", "en": "Korean \"케바케\" (case by case) is just <b>It depends.</b>"} },
  { id:"u26-honest", unit:26, topic:{"ko": "솔직하게", "en": "Being honest"}, chunks:[{"en": "To be honest, ___.", "ko": "솔직히 말하면 ~", "use": {"ko": "솔직한 의견", "en": "Giving your honest view"}, "ex": "To be honest, I didn't like it.", "hl": "To be honest", "exko": "솔직히 말하면, 별로였어요."}, {"en": "I'm not a fan of ___.", "ko": "저는 ~를 별로 안 좋아해요.", "use": {"ko": "부드럽게 싫다고 할 때", "en": "Saying you don't like something, softly"}, "ex": "I'm not a fan of loud music.", "hl": "I'm not a fan of", "exko": "저는 시끄러운 음악을 별로 안 좋아해요."}], builds:[{"ko": "솔직히 말하면, 너무 비싸요.", "en": "To be honest, it's too expensive.", "answer": ["To be honest,", "it's", "too expensive."], "decoys": ["Honestly to", "very"]}, {"ko": "저는 공포 영화를 별로 안 좋아해요.", "en": "I'm not a fan of horror movies.", "answer": ["I'm not", "a fan of", "horror movies."], "decoys": ["I don't", "fan to"]}], ask:{"q": "What do you honestly think about social media?", "qko": "소셜 미디어에 대해 솔직히 어떻게 생각해요?", "must": ["to be honest", "honestly", "i think"], "use": "To be honest, ___.", "ex": "To be honest, I spend too much time on it."}, tip:{"ko": "I hate it은 강하게 들려요. <b>I'm not a fan of it</b>이 더 부드러워요.", "en": "\"I hate it\" sounds strong. <b>I'm not a fan of it</b> is softer."} },
  { id:"u26-island", unit:26, island:true, uses:["u26-ask", "u26-think", "u26-because"], topic:{"ko": "영화 보고 나서", "en": "After a movie"}, desc:{"ko": "먼저 대화를 들어 보세요 🎧<br>그다음 직접 만들어요!", "en": "Listen to the conversation first 🎧<br>Then build it yourself!"}, dialog:[{"who": "friend", "en": "So, what do you think about the movie?", "ko": "그래서, 영화 어떻게 생각해?"}, {"who": "you", "en": "I think it was really good.", "ko": "내 생각엔 정말 좋았어."}, {"who": "friend", "en": "Really? Why?", "ko": "진짜? 왜?"}, {"who": "you", "en": "That's because the story was so creative.", "ko": "그건 이야기가 정말 독창적이었기 때문이야."}, {"who": "you", "en": "For example, the ending was a big surprise.", "ko": "예를 들면, 결말이 완전 반전이었어."}, {"who": "friend", "en": "That's true!", "ko": "그건 맞아!"}], builds:[{"ko": "내 생각엔 정말 좋았어.", "en": "I think it was really good.", "answer": ["I think", "it was", "really good."], "decoys": ["I'm thinking"]}, {"ko": "그건 이야기가 정말 독창적이었기 때문이야.", "en": "That's because the story was so creative.", "answer": ["That's because", "the story was", "so creative."], "decoys": ["because of"]}, {"ko": "예를 들면, 결말이 완전 반전이었어.", "en": "For example, the ending was a big surprise.", "answer": ["For example,", "the ending was", "a big surprise."], "decoys": ["For examples"]}], tip:{"ko": "🏝️ 이제 영어로 내 생각을 이유와 함께 말할 수 있어요!", "en": "🏝️ You can now share your opinion with reasons in English!"} },
  { id:"u27-agree", unit:27, topic:{"ko": "동의하기", "en": "Agreeing"}, chunks:[{"en": "I totally agree.", "ko": "완전 동의해요.", "use": {"ko": "강하게 동의할 때", "en": "Strongly agreeing"}, "ex": "I totally agree with you.", "hl": "I totally agree", "exko": "완전 동의해요."}, {"en": "That's a good point.", "ko": "좋은 지적이에요.", "use": {"ko": "상대 말이 일리 있을 때", "en": "When someone makes a fair point"}, "ex": "Hmm, that's a good point.", "hl": "that's a good point.", "exko": "음, 좋은 지적이에요."}], builds:[{"ko": "완전 동의해요.", "en": "I totally agree with you.", "answer": ["I totally", "agree", "with you."], "decoys": ["I'm totally", "agree to"]}, {"ko": "그거 좋은 지적이네요.", "en": "That's a good point.", "answer": ["That's", "a good", "point."], "decoys": ["It's", "good pointed"]}], ask:{"q": "\"Coffee is better in the morning.\" Agree with your friend.", "qko": "\"커피는 아침에 마셔야 제맛이야.\" 친구 말에 동의해 보세요.", "must": ["agree", "good point", "true"], "use": "I totally agree.", "ex": "I totally agree. Coffee wakes me up."}, tip:{"ko": "❌ I'm agree.<br>✅ <b>I agree.</b> (agree는 동사라서 am이 필요 없어요)", "en": "❌ I'm agree.<br>✅ <b>I agree.</b> (\"agree\" is already a verb)"} },
  { id:"u27-disagree", unit:27, topic:{"ko": "반대하기", "en": "Disagreeing politely"}, chunks:[{"en": "I see your point, but ___.", "ko": "무슨 말인지 알겠지만 ~", "use": {"ko": "부드럽게 반대할 때", "en": "Disagreeing gently"}, "ex": "I see your point, but I think it's too risky.", "hl": "I see your point, but", "exko": "무슨 말인지 알겠지만, 너무 위험한 것 같아요."}, {"en": "I'm not sure about that.", "ko": "그건 잘 모르겠어요.", "use": {"ko": "동의하기 어려울 때", "en": "When you doubt something"}, "ex": "Hmm, I'm not sure about that.", "hl": "I'm not sure about that.", "exko": "음, 그건 잘 모르겠어요."}], builds:[{"ko": "무슨 말인지 알겠지만, 저는 동의하지 않아요.", "en": "I see your point, but I don't agree.", "answer": ["I see your point,", "but", "I don't agree."], "decoys": ["I see your", "I'm not agree"]}, {"ko": "음, 그건 잘 모르겠어요.", "en": "Hmm, I'm not sure about that.", "answer": ["Hmm,", "I'm not sure", "about that."], "decoys": ["I don't sure", "for that"]}], ask:{"q": "\"Summer is the best season.\" Disagree politely.", "qko": "\"여름이 최고의 계절이야.\" 공손하게 반대해 보세요.", "must": ["see your point", "not sure", "but"], "use": "I see your point, but ___.", "ex": "I see your point, but I think fall is better."}, tip:{"ko": "영어권에선 바로 \"No\"보다 <b>I see your point, but...</b>처럼 쿠션을 깔아요.", "en": "In English, soften disagreement with a cushion like <b>I see your point, but...</b>"} },
  { id:"u27-partly", unit:27, topic:{"ko": "어느 정도 동의", "en": "Partly agreeing"}, chunks:[{"en": "You're right about ___.", "ko": "~에 대해서는 맞아요.", "use": {"ko": "일부만 동의할 때", "en": "Agreeing with part of it"}, "ex": "You're right about the price.", "hl": "You're right about", "exko": "가격에 대해서는 맞아요."}, {"en": "I agree up to a point.", "ko": "어느 정도는 동의해요.", "use": {"ko": "완전히 동의하지 않을 때", "en": "Partly agreeing"}, "ex": "I agree up to a point, but it's not that simple.", "hl": "I agree up to a point", "exko": "어느 정도는 동의하지만, 그렇게 간단하진 않아요."}], builds:[{"ko": "위치에 대해서는 맞아요.", "en": "You're right about the location.", "answer": ["You're right", "about", "the location."], "decoys": ["You right", "for"]}, {"ko": "어느 정도는 동의해요.", "en": "I agree up to a point.", "answer": ["I agree", "up to", "a point."], "decoys": ["I'm agree", "until"]}], ask:{"q": "\"Smartphones are bad for kids.\" What do you think?", "qko": "\"스마트폰은 아이들에게 나빠.\" 어떻게 생각해요?", "must": ["agree", "right", "but", "i think"], "use": "You're right about ___, but ___.", "ex": "You're right about games, but phones are useful too."}, tip:{"ko": "동의 + 반대를 섞으면 대화가 더 자연스러워져요: <b>Yes, but...</b>", "en": "Mixing agreement and disagreement sounds natural: <b>Yes, but...</b>"} },
  { id:"u27-same", unit:27, topic:{"ko": "나도 그래", "en": "Me too / Me neither"}, chunks:[{"en": "Me too.", "ko": "나도.", "use": {"ko": "긍정문에 동의할 때", "en": "Agreeing with a positive sentence"}, "ex": "I love pizza. Me too!", "hl": "Me too", "exko": "나 피자 좋아해. 나도!"}, {"en": "Me neither.", "ko": "나도 아니야.", "use": {"ko": "부정문에 동의할 때", "en": "Agreeing with a negative sentence"}, "ex": "I don't like horror movies. Me neither.", "hl": "Me neither.", "exko": "나 공포 영화 안 좋아해. 나도 안 좋아해."}], builds:[{"ko": "나도 그래!", "en": "Me too!", "answer": ["Me", "too!"], "decoys": ["also!", "so"]}, {"ko": "나도 아니야.", "en": "Me neither.", "answer": ["Me", "neither."], "decoys": ["either.", "not"]}], ask:{"q": "\"I don't like waking up early.\" Agree with your friend.", "qko": "\"나 일찍 일어나는 거 싫어.\" 친구 말에 동의해 보세요.", "must": ["me neither", "neither"], "use": "Me neither.", "ex": "Me neither! I love sleeping in."}, tip:{"ko": "❌ I don't like it. — Me too.<br>✅ I don't like it. — <b>Me neither.</b>", "en": "❌ I don't like it. — Me too.<br>✅ I don't like it. — <b>Me neither.</b>"} },
  { id:"u27-change", unit:27, topic:{"ko": "생각 바꾸기", "en": "Changing your mind"}, chunks:[{"en": "You've changed my mind.", "ko": "덕분에 생각이 바뀌었어요.", "use": {"ko": "설득당했을 때", "en": "When someone convinces you"}, "ex": "Okay, you've changed my mind.", "hl": "you've changed my mind.", "exko": "좋아요, 덕분에 생각이 바뀌었어요."}, {"en": "Let's agree to disagree.", "ko": "서로 생각이 다른 걸로 하죠.", "use": {"ko": "의견 차이를 인정할 때", "en": "Ending a debate kindly"}, "ex": "Ha ha, let's agree to disagree.", "hl": "let's agree to disagree.", "exko": "하하, 서로 생각이 다른 걸로 하죠."}], builds:[{"ko": "좋아, 덕분에 생각이 바뀌었어.", "en": "Okay, you've changed my mind.", "answer": ["Okay,", "you've changed", "my mind."], "decoys": ["you change", "my thinking"]}, {"ko": "서로 생각이 다른 걸로 하자.", "en": "Let's agree to disagree.", "answer": ["Let's agree", "to", "disagree."], "decoys": ["Let's agreeing", "not agree"]}], ask:{"q": "You and your friend can't agree. End the debate kindly.", "qko": "친구와 의견이 안 맞아요. 기분 좋게 대화를 마무리해 보세요.", "must": ["agree to disagree", "changed my mind"], "use": "Let's agree to disagree.", "ex": "Ha ha, okay. Let's agree to disagree."}, tip:{"ko": "<b>agree to disagree</b>는 싸우지 않고 대화를 끝내는 좋은 방법이에요.", "en": "<b>agree to disagree</b> is a friendly way to end a debate."} },

  { id:"u28-glad", unit:28, topic:{"ko": "기쁨 표현", "en": "Being glad"}, chunks:[{"en": "I'm so glad ___.", "ko": "~해서 정말 다행이에요/기뻐요.", "use": {"ko": "좋은 소식에", "en": "When you hear good news"}, "ex": "I'm so glad you came!", "hl": "I'm so glad", "exko": "와 줘서 정말 기뻐요!"}, {"en": "That's great news!", "ko": "정말 좋은 소식이네요!", "use": {"ko": "축하할 소식", "en": "Reacting to good news"}, "ex": "You got the job? That's great news!", "hl": "That's great news!", "exko": "합격했어? 정말 좋은 소식이다!"}], builds:[{"ko": "네가 괜찮아서 정말 다행이야.", "en": "I'm so glad you're okay.", "answer": ["I'm so glad", "you're", "okay."], "decoys": ["I'm so happy", "you okay"]}, {"ko": "정말 좋은 소식이네요!", "en": "That's great news!", "answer": ["That's", "great", "news!"], "decoys": ["That's a", "good newses"]}], ask:{"q": "\"I passed my driving test!\" React to your friend.", "qko": "\"나 운전면허 시험 붙었어!\" 친구에게 반응해 보세요.", "must": ["great news", "glad", "congratulations"], "use": "That's great news!", "ex": "That's great news! Congratulations!"}, tip:{"ko": "news는 항상 단수예요: ❌ a news ✅ <b>That's great news!</b>", "en": "\"News\" is uncountable: ❌ a news ✅ <b>That's great news!</b>"} },

  { id:"u28-nervous", unit:28, topic:{"ko": "긴장", "en": "Nerves"}, chunks:[{"en": "I'm so nervous about ___.", "ko": "~ 때문에 너무 긴장돼요.", "use": {"ko": "떨릴 때", "en": "When you're nervous"}, "ex": "I'm so nervous about my speech.", "hl": "I'm so nervous about", "exko": "발표 때문에 너무 긴장돼요."}, {"en": "You've got this!", "ko": "넌 할 수 있어!", "use": {"ko": "응원할 때", "en": "Cheering someone on"}, "ex": "Don't worry. You've got this!", "hl": "You've got this!", "exko": "걱정 마. 넌 할 수 있어!"}], builds:[{"ko": "면접 때문에 너무 긴장돼.", "en": "I'm so nervous about my interview.", "answer": ["I'm so nervous", "about", "my interview."], "decoys": ["I'm so nerve", "for"]}, {"ko": "걱정 마. 넌 할 수 있어!", "en": "Don't worry. You've got this!", "answer": ["Don't worry.", "You've", "got this!"], "decoys": ["You can", "get this!"]}], ask:{"q": "Your friend has an exam tomorrow. Cheer them on.", "qko": "친구가 내일 시험이에요. 응원해 보세요.", "must": ["got this", "good luck", "you can"], "use": "You've got this!", "ex": "Good luck tomorrow! You've got this!"}, tip:{"ko": "한국어 \"화이팅!\"은 영어로 <b>You've got this!</b> 또는 <b>Good luck!</b>이에요.", "en": "Korean \"화이팅!\" is <b>You've got this!</b> or <b>Good luck!</b> in English."} },

  { id:"u29-wrong", unit:29, topic:{"ko": "문제 알리기", "en": "Reporting a problem"}, chunks:[{"en": "I think there's a mistake.", "ko": "실수가 있는 것 같아요.", "use": {"ko": "계산서나 주문에 문제가 있을 때", "en": "When a bill or order is wrong"}, "ex": "Excuse me, I think there's a mistake.", "hl": "I think there's a mistake.", "exko": "저기요, 실수가 있는 것 같아요."}, {"en": "This isn't what I ordered.", "ko": "제가 주문한 게 아니에요.", "use": {"ko": "다른 음식이 나왔을 때", "en": "When you get the wrong order"}, "ex": "Sorry, this isn't what I ordered.", "hl": "this isn't what I ordered.", "exko": "죄송한데, 제가 주문한 게 아니에요."}], builds:[{"ko": "계산서에 실수가 있는 것 같아요.", "en": "I think there's a mistake on the bill.", "answer": ["I think", "there's a mistake", "on the bill."], "decoys": ["I thinking", "it has mistake"]}, {"ko": "죄송한데, 제가 주문한 게 아니에요.", "en": "Sorry, this isn't what I ordered.", "answer": ["Sorry,", "this isn't", "what I ordered."], "decoys": ["this is not my", "I order"]}], ask:{"q": "The waiter brought the wrong dish. What do you say?", "qko": "직원이 다른 음식을 가져왔어요. 뭐라고 할까요?", "must": ["not what i ordered", "mistake"], "use": "This isn't what I ordered.", "ex": "Excuse me, this isn't what I ordered. I ordered the pasta."}, tip:{"ko": "문제를 말할 때 <b>Excuse me</b>나 <b>Sorry</b>로 시작하면 훨씬 부드러워요.", "en": "Start with <b>Excuse me</b> or <b>Sorry</b> to sound much softer."} },
  { id:"u29-complain", unit:29, topic:{"ko": "불만 말하기", "en": "Making a complaint"}, chunks:[{"en": "I'm not happy with ___.", "ko": "~가 만족스럽지 않아요.", "use": {"ko": "서비스나 물건에 불만이 있을 때", "en": "When you're unhappy with something"}, "ex": "I'm not happy with the service.", "hl": "I'm not happy with", "exko": "서비스가 만족스럽지 않아요."}, {"en": "I've been waiting for ___.", "ko": "~ 동안 기다리고 있어요.", "use": {"ko": "오래 기다렸을 때", "en": "When you've waited too long"}, "ex": "I've been waiting for 40 minutes.", "hl": "I've been waiting for", "exko": "40분 동안 기다리고 있어요."}], builds:[{"ko": "방이 만족스럽지 않아요.", "en": "I'm not happy with the room.", "answer": ["I'm not happy", "with", "the room."], "decoys": ["I'm not", "happy about to"]}, {"ko": "한 시간 동안 기다리고 있어요.", "en": "I've been waiting for an hour.", "answer": ["I've been waiting", "for", "an hour."], "decoys": ["I waited", "since"]}], ask:{"q": "Your food hasn't come after a long time. Talk to the staff.", "qko": "음식이 한참 동안 안 나와요. 직원에게 말해 보세요.", "must": ["been waiting"], "use": "I've been waiting for ___.", "ex": "Excuse me, I've been waiting for 30 minutes."}, tip:{"ko": "<b>I've been ~ing</b>은 \"지금까지 계속 ~하고 있다\"는 뜻이에요.", "en": "<b>I've been ~ing</b> means you started in the past and are still doing it."} },
  { id:"u29-ask", unit:29, topic:{"ko": "해결 요청", "en": "Asking for a fix"}, chunks:[{"en": "Could you ___?", "ko": "~해 주실 수 있나요?", "use": {"ko": "정중하게 요청할 때", "en": "A polite request"}, "ex": "Could you check again, please?", "hl": "Could you", "exko": "다시 확인해 주실 수 있나요?"}, {"en": "Is there anything you can do?", "ko": "어떻게 좀 해 주실 수 있나요?", "use": {"ko": "해결책을 물을 때", "en": "Asking for a solution"}, "ex": "The room is too noisy. Is there anything you can do?", "hl": "Is there anything you can do?", "exko": "방이 너무 시끄러워요. 어떻게 좀 해 주실 수 있나요?"}], builds:[{"ko": "다른 방으로 바꿔 주실 수 있나요?", "en": "Could you give me a different room?", "answer": ["Could you", "give me", "a different room?"], "decoys": ["Could you change", "other room"]}, {"ko": "어떻게 좀 해 주실 수 있나요?", "en": "Is there anything you can do?", "answer": ["Is there anything", "you can", "do?"], "decoys": ["Is there something", "can you"]}], ask:{"q": "Your hotel room is dirty. Ask for help.", "qko": "호텔 방이 더러워요. 도움을 요청해 보세요.", "must": ["could you", "anything you can do"], "use": "Could you ___?", "ex": "My room is dirty. Could you clean it, please?"}, tip:{"ko": "화가 나도 <b>Could you ~, please?</b>를 쓰면 더 빨리 해결돼요.", "en": "Even when you're upset, <b>Could you ~, please?</b> gets things fixed faster."} },
  { id:"u29-sorry", unit:29, topic:{"ko": "사과하기", "en": "Apologizing"}, chunks:[{"en": "I'm really sorry about ___.", "ko": "~해서 정말 죄송해요.", "use": {"ko": "진심으로 사과할 때", "en": "A sincere apology"}, "ex": "I'm really sorry about yesterday.", "hl": "I'm really sorry about", "exko": "어제 일은 정말 죄송해요."}, {"en": "It won't happen again.", "ko": "다시는 이런 일 없을 거예요.", "use": {"ko": "재발 방지를 약속할 때", "en": "Promising to do better"}, "ex": "I'm so sorry. It won't happen again.", "hl": "It won't happen again.", "exko": "정말 죄송해요. 다시는 이런 일 없을 거예요."}], builds:[{"ko": "늦어서 정말 미안해.", "en": "I'm really sorry for being late.", "answer": ["I'm really sorry", "for", "being late."], "decoys": ["I really sorry", "to late"]}, {"ko": "다시는 이런 일 없을 거예요.", "en": "It won't happen again.", "answer": ["It won't", "happen", "again."], "decoys": ["It will not", "happening"]}], ask:{"q": "You forgot your friend's birthday. Apologize.", "qko": "친구 생일을 깜빡했어요. 사과해 보세요.", "must": ["sorry", "won't happen"], "use": "I'm really sorry about ___.", "ex": "I'm really sorry I forgot your birthday. It won't happen again."}, tip:{"ko": "사과할 이유: <b>sorry about + 명사</b>, <b>sorry for + ~ing</b>", "en": "Reasons: <b>sorry about + noun</b>, <b>sorry for + ~ing</b>"} },
  { id:"u29-fine", unit:29, topic:{"ko": "사과 받아 주기", "en": "Accepting an apology"}, chunks:[{"en": "Don't worry about it.", "ko": "신경 쓰지 마세요.", "use": {"ko": "괜찮다고 할 때", "en": "Saying it's okay"}, "ex": "It's fine. Don't worry about it.", "hl": "Don't worry about it.", "exko": "괜찮아요. 신경 쓰지 마세요."}, {"en": "These things happen.", "ko": "그럴 수도 있죠.", "use": {"ko": "실수를 이해해 줄 때", "en": "Being understanding"}, "ex": "No problem. These things happen.", "hl": "These things happen.", "exko": "괜찮아요. 그럴 수도 있죠."}], builds:[{"ko": "괜찮아요. 신경 쓰지 마세요.", "en": "It's fine. Don't worry about it.", "answer": ["It's fine.", "Don't worry", "about it."], "decoys": ["Not worry", "for it"]}, {"ko": "그럴 수도 있죠.", "en": "These things happen.", "answer": ["These", "things", "happen."], "decoys": ["This", "thing happens"]}], ask:{"q": "Your coworker spilled coffee on your desk and says sorry. Respond.", "qko": "동료가 내 책상에 커피를 쏟고 사과해요. 대답해 보세요.", "must": ["don't worry", "do not worry", "it is fine", "happen"], "use": "Don't worry about it.", "ex": "It's okay! Don't worry about it. These things happen."}, tip:{"ko": "<b>No worries!</b>도 \"괜찮아!\"라는 뜻으로 자주 써요.", "en": "<b>No worries!</b> is another common way to say \"It's okay!\""} },
  { id:"u29-island", unit:29, island:true, uses:["u29-wrong", "u29-complain", "u29-ask"], topic:{"ko": "식당에서 생긴 문제", "en": "A problem at a restaurant"}, desc:{"ko": "먼저 대화를 들어 보세요 🎧<br>그다음 직접 만들어요!", "en": "Listen to the conversation first 🎧<br>Then build it yourself!"}, dialog:[{"who": "you", "en": "Excuse me. I've been waiting for 40 minutes.", "ko": "저기요. 40분 동안 기다리고 있어요."}, {"who": "waiter", "en": "I'm so sorry. Here's your food.", "ko": "정말 죄송합니다. 여기 음식 나왔습니다."}, {"who": "you", "en": "Sorry, this isn't what I ordered.", "ko": "죄송한데, 제가 주문한 게 아니에요."}, {"who": "waiter", "en": "Oh no! What did you order?", "ko": "이런! 뭘 주문하셨죠?"}, {"who": "you", "en": "The salmon. Could you check again, please?", "ko": "연어요. 다시 확인해 주실 수 있나요?"}, {"who": "waiter", "en": "Of course. It won't happen again.", "ko": "물론이죠. 다시는 이런 일 없을 거예요."}], builds:[{"ko": "저기요. 40분 동안 기다리고 있어요.", "en": "Excuse me. I've been waiting for 40 minutes.", "answer": ["Excuse me.", "I've been waiting", "for 40 minutes."], "decoys": ["since"]}, {"ko": "죄송한데, 제가 주문한 게 아니에요.", "en": "Sorry, this isn't what I ordered.", "answer": ["Sorry,", "this isn't", "what I ordered."], "decoys": ["I order"]}, {"ko": "연어요. 다시 확인해 주실 수 있나요?", "en": "The salmon. Could you check again, please?", "answer": ["The salmon.", "Could you", "check again, please?"], "decoys": ["Can you checking"]}], tip:{"ko": "🏝️ 이제 영어로 문제를 침착하게 해결할 수 있어요!", "en": "🏝️ You can now calmly solve problems in English!"} },
  { id:"u30-should", unit:30, topic:{"ko": "조언하기", "en": "Giving advice"}, chunks:[{"en": "You should ___.", "ko": "~하는 게 좋겠어요.", "use": {"ko": "조언할 때", "en": "Giving advice"}, "ex": "You should get some rest.", "hl": "You should", "exko": "좀 쉬는 게 좋겠어요."}, {"en": "Why don't you ___?", "ko": "~하는 게 어때요?", "use": {"ko": "부드럽게 제안할 때", "en": "A soft suggestion"}, "ex": "Why don't you call her?", "hl": "Why don't you", "exko": "그녀에게 전화해 보는 게 어때요?"}], builds:[{"ko": "병원에 가 보는 게 좋겠어.", "en": "You should see a doctor.", "answer": ["You should", "see", "a doctor."], "decoys": ["You must", "seeing"]}, {"ko": "오늘 일찍 자는 게 어때?", "en": "Why don't you go to bed early tonight?", "answer": ["Why don't you", "go to bed early", "tonight?"], "decoys": ["Why you don't", "sleep early"]}], ask:{"q": "\"I'm always tired.\" Give your friend some advice.", "qko": "\"나 맨날 피곤해.\" 친구에게 조언해 보세요.", "must": ["you should", "why don't you", "why do not you"], "use": "You should ___.", "ex": "You should go to bed earlier."}, tip:{"ko": "<b>must</b>는 \"반드시\"라 너무 강해요. 조언은 <b>should</b>!", "en": "<b>must</b> sounds too strong. For advice, use <b>should</b>!"} },
  { id:"u30-if", unit:30, topic:{"ko": "나라면", "en": "If I were you"}, chunks:[{"en": "If I were you, I'd ___.", "ko": "내가 너라면 ~할 거야.", "use": {"ko": "내 입장에서 조언할 때", "en": "Advice from your point of view"}, "ex": "If I were you, I'd take the job.", "hl": "If I were you", "exko": "내가 너라면 그 일을 할 거야."}, {"en": "It might be a good idea to ___.", "ko": "~하는 것도 좋은 생각일 수 있어요.", "use": {"ko": "아주 부드럽게", "en": "A very gentle suggestion"}, "ex": "It might be a good idea to save some money.", "hl": "It might be a good idea to", "exko": "돈을 좀 모아 두는 것도 좋은 생각일 수 있어요."}], builds:[{"ko": "내가 너라면 사과할 거야.", "en": "If I were you, I'd say sorry.", "answer": ["If I were you,", "I'd", "say sorry."], "decoys": ["If I was", "I will"]}, {"ko": "미리 예약하는 것도 좋은 생각일 수 있어요.", "en": "It might be a good idea to book early.", "answer": ["It might be", "a good idea", "to book early."], "decoys": ["It may", "good idea for"]}], ask:{"q": "\"I can't decide between two jobs.\" Give advice.", "qko": "\"두 직장 중에 못 고르겠어.\" 조언해 보세요.", "must": ["if i were you", "i would", "good idea"], "use": "If I were you, I'd ___.", "ex": "If I were you, I'd choose the one you enjoy."}, tip:{"ko": "문법상 <b>If I were you</b>가 맞아요 (was 아님). 원어민도 자주 쓰는 공식이에요!", "en": "It's <b>If I were you</b> (not \"was\"). A fixed phrase natives use all the time!"} },
  { id:"u30-dont", unit:30, topic:{"ko": "하지 마", "en": "Warning someone"}, chunks:[{"en": "You shouldn't ___.", "ko": "~하지 않는 게 좋겠어요.", "use": {"ko": "하지 말라고 조언할 때", "en": "Advising against something"}, "ex": "You shouldn't drink coffee at night.", "hl": "You shouldn't", "exko": "밤에 커피 안 마시는 게 좋겠어요."}, {"en": "Be careful with ___.", "ko": "~ 조심하세요.", "use": {"ko": "주의를 줄 때", "en": "Giving a warning"}, "ex": "Be careful with that knife.", "hl": "Be careful with", "exko": "그 칼 조심하세요."}], builds:[{"ko": "너무 많이 걱정하지 않는 게 좋겠어.", "en": "You shouldn't worry so much.", "answer": ["You shouldn't", "worry", "so much."], "decoys": ["You don't should", "worrying"]}, {"ko": "뜨거운 물 조심하세요.", "en": "Be careful with the hot water.", "answer": ["Be careful", "with", "the hot water."], "decoys": ["Careful be", "for"]}], ask:{"q": "Your friend wants to buy a very expensive phone with all their savings. Warn them.", "qko": "친구가 모은 돈을 다 털어서 아주 비싼 폰을 사려고 해요. 말려 보세요.", "must": ["should not", "shouldn't", "careful"], "use": "You shouldn't ___.", "ex": "You shouldn't spend all your money on a phone."}, tip:{"ko": "조심해! 한 마디로는 <b>Watch out!</b> 또는 <b>Be careful!</b>이에요.", "en": "For a quick \"Careful!\", say <b>Watch out!</b> or <b>Be careful!</b>"} },
  { id:"u30-ask", unit:30, topic:{"ko": "조언 구하기", "en": "Asking for advice"}, chunks:[{"en": "What should I do?", "ko": "어떻게 해야 할까요?", "use": {"ko": "고민 상담할 때", "en": "When you need advice"}, "ex": "I lost my wallet. What should I do?", "hl": "What should I do?", "exko": "지갑을 잃어버렸어요. 어떻게 해야 할까요?"}, {"en": "Can I ask your advice?", "ko": "조언 좀 구해도 될까요?", "use": {"ko": "조언을 부탁할 때", "en": "Asking someone for advice"}, "ex": "Can I ask your advice about something?", "hl": "Can I ask your advice", "exko": "뭐 좀 조언 구해도 될까요?"}], builds:[{"ko": "어떻게 해야 할까?", "en": "What should I do?", "answer": ["What", "should", "I do?"], "decoys": ["What I", "should do"]}, {"ko": "조언 좀 구해도 될까요?", "en": "Can I ask your advice?", "answer": ["Can I", "ask", "your advice?"], "decoys": ["Could I", "give your advices"]}], ask:{"q": "You have a problem. Ask your friend for advice.", "qko": "고민이 있어요. 친구에게 조언을 구해 보세요.", "must": ["what should i do", "advice"], "use": "Can I ask your advice? What should I do?", "ex": "I want to learn English faster. What should I do?"}, tip:{"ko": "advice는 셀 수 없어요: ❌ an advice ✅ <b>some advice</b> / <b>a piece of advice</b>", "en": "\"Advice\" is uncountable: ❌ an advice ✅ <b>some advice</b> / <b>a piece of advice</b>"} },
  { id:"u30-thanks", unit:30, topic:{"ko": "조언에 답하기", "en": "Responding to advice"}, chunks:[{"en": "That's a great idea.", "ko": "그거 좋은 생각이네요.", "use": {"ko": "조언이 마음에 들 때", "en": "When you like the advice"}, "ex": "That's a great idea. I'll try that.", "hl": "That's a great idea.", "exko": "그거 좋은 생각이네요. 해 볼게요."}, {"en": "I'll give it a try.", "ko": "한번 해 볼게요.", "use": {"ko": "시도해 보겠다고 할 때", "en": "Saying you'll try it"}, "ex": "Okay, I'll give it a try.", "hl": "I'll give it a try.", "exko": "좋아요, 한번 해 볼게요."}], builds:[{"ko": "그거 좋은 생각이네요.", "en": "That's a great idea.", "answer": ["That's", "a great", "idea."], "decoys": ["It's", "good thinking"]}, {"ko": "좋아, 한번 해 볼게.", "en": "Okay, I'll give it a try.", "answer": ["Okay,", "I'll give", "it a try."], "decoys": ["I'll try", "it give"]}], ask:{"q": "Your friend says, \"You should try running.\" Respond.", "qko": "친구가 \"달리기를 해 봐.\"라고 해요. 대답해 보세요.", "must": ["great idea", "give it a try", "try"], "use": "That's a great idea. I'll give it a try.", "ex": "That's a great idea. I'll give it a try this weekend."}, tip:{"ko": "<b>give it a try</b> = <b>give it a shot</b>. 둘 다 \"한번 해 볼게\"예요.", "en": "<b>give it a try</b> = <b>give it a shot</b>. Both mean \"I'll try.\""} },
  { id:"u30-island", unit:30, island:true, uses:["u30-ask", "u30-should", "u30-thanks"], topic:{"ko": "친구의 고민 상담", "en": "Helping a friend"}, desc:{"ko": "먼저 대화를 들어 보세요 🎧<br>그다음 직접 만들어요!", "en": "Listen to the conversation first 🎧<br>Then build it yourself!"}, dialog:[{"who": "friend", "en": "Can I ask your advice?", "ko": "조언 좀 구해도 돼?"}, {"who": "you", "en": "Sure. What's up?", "ko": "그럼. 무슨 일이야?"}, {"who": "friend", "en": "I can't sleep at night. What should I do?", "ko": "밤에 잠을 못 자. 어떻게 해야 할까?"}, {"who": "you", "en": "You should stop using your phone in bed.", "ko": "침대에서 폰 그만 보는 게 좋겠어."}, {"who": "you", "en": "Why don't you read a book instead?", "ko": "대신 책을 읽어 보는 건 어때?"}, {"who": "friend", "en": "That's a great idea. I'll give it a try.", "ko": "좋은 생각이다. 한번 해 볼게."}], builds:[{"ko": "그럼. 무슨 일이야?", "en": "Sure. What's up?", "answer": ["Sure.", "What's", "up?"], "decoys": ["What is", "upping"]}, {"ko": "침대에서 폰 그만 보는 게 좋겠어.", "en": "You should stop using your phone in bed.", "answer": ["You should", "stop using your phone", "in bed."], "decoys": ["You must"]}, {"ko": "대신 책을 읽어 보는 건 어때?", "en": "Why don't you read a book instead?", "answer": ["Why don't you", "read a book", "instead?"], "decoys": ["Why you don't"]}], tip:{"ko": "🏝️ 이제 영어로 친구에게 좋은 조언을 해 줄 수 있어요!", "en": "🏝️ You can now give friends good advice in English!"} },
